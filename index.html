<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneDay: pick an era, build a character, and live one decisive day.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OneDay">
  <meta property="og:description" content="Pick an era, build a character, and live one decisive day of data-driven decision cards.">
  <meta property="og:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://lucasmarjua-ui.github.io/oneday/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OneDay">
  <meta name="twitter:description" content="Pick an era, build a character, and live one decisive day of data-driven decision cards.">
  <meta name="twitter:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <title>OneDay</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./shared/theme.css">
</head>
<body>
  <header class="site-nav">
    <nav class="nav-inner">
      <span class="nav-logo">OneDay</span>
      <div class="nav-links">
        <a href="#" class="nav-link active" data-i18n="nav.home"></a>
        <a href="#how-it-works" class="nav-link" data-i18n="nav.howItWorks"></a>
        <a href="#era-grid" class="nav-link" data-i18n="nav.dailyChallenge"></a>
        <button id="profile-open" class="nav-link nav-link-btn" type="button" data-i18n="nav.profile"></button>
      </div>
      <div class="nav-actions">
        <button id="lang-en" class="lang-btn" type="button">EN</button>
        <button id="lang-es" class="lang-btn" type="button">ES</button>
        <span id="player-name" class="nav-player" hidden></span>
        <button id="login-open" class="nav-link nav-link-btn" type="button" data-i18n="nav.login"></button>
        <button id="logout" class="nav-link nav-link-btn" type="button" hidden data-i18n="nav.logout"></button>
        <button id="hero-cta-nav" class="btn liquid-glass" type="button" data-i18n="nav.cta"></button>
      </div>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title animate-fade-rise" id="hero-title"></h1>
      <p class="hero-subtitle animate-fade-rise-delay" data-i18n="home.heroSubtitle"></p>
      <button id="hero-cta" class="btn liquid-glass hero-cta animate-fade-rise-delay-2" type="button" data-i18n="nav.cta"></button>
    </div>
  </section>

  <main>
    <section id="era-screen">
      <h2 data-i18n="era.chooseHeading"></h2>
      <div class="era-grid" id="era-grid"></div>

      <section class="how-it-works" id="how-it-works">
        <h2 data-i18n="home.howHeading"></h2>
        <div class="how-steps">
          <div class="how-step">
            <div class="how-icon"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 28 L59 50 L50 72 L41 50 Z"/></svg></div>
            <h3 data-i18n="home.step1Title"></h3>
            <p data-i18n="home.step1Desc"></p>
          </div>
          <div class="how-step">
            <div class="how-icon"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="22"/><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><line x1="50" y1="6" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="94"/><line x1="6" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="94" y2="50"/><line x1="18" y1="18" x2="26" y2="26"/><line x1="74" y1="74" x2="82" y2="82"/><line x1="18" y1="82" x2="26" y2="74"/><line x1="74" y1="26" x2="82" y2="18"/></g></svg></div>
            <h3 data-i18n="home.step2Title"></h3>
            <p data-i18n="home.step2Desc"></p>
          </div>
          <div class="how-step">
            <div class="how-icon"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="26" y="10" width="7" height="82" rx="3"/><path d="M33 14 L78 26 L33 44 Z"/></svg></div>
            <h3 data-i18n="home.step3Title"></h3>
            <p data-i18n="home.step3Desc"></p>
          </div>
        </div>
      </section>
    </section>

    <section id="archetype-screen" class="panel" hidden>
      <h2 id="archetype-heading"></h2>
      <div class="era-grid" id="archetype-grid"></div>
      <div class="actions-row">
        <button id="archetype-back" class="btn btn-ghost" type="button" data-i18n="archetype.back"></button>
        <button id="archetype-next" class="btn" type="button" data-i18n="archetype.next"></button>
      </div>
    </section>

    <section id="appearance-screen" class="panel" hidden>
      <h2 id="appearance-heading"></h2>
      <div class="character-layout">
        <div class="character-preview" id="character-preview"></div>
        <div>
          <div id="base-options" class="option-row"></div>
          <div id="slot-options"></div>
        </div>
      </div>
      <div class="actions-row">
        <button id="appearance-back" class="btn btn-ghost" type="button" data-i18n="appearance.back"></button>
        <button id="appearance-begin" class="btn" type="button" data-i18n="appearance.begin"></button>
      </div>
    </section>
  </main>

  <div id="login-modal" class="modal-backdrop" hidden>
    <div class="modal panel">
      <h2 data-i18n="login.heading"></h2>
      <p class="app-subtitle" data-i18n="login.description"></p>
      <div class="field">
        <label for="login-username" data-i18n="login.username"></label>
        <input id="login-username" type="text" autocomplete="username" maxlength="16">
      </div>
      <div class="field">
        <label for="login-password" data-i18n="login.password"></label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="modal-actions">
        <button id="login-close" class="btn btn-ghost" type="button" data-i18n="login.cancel"></button>
        <button id="login-register" class="btn btn-ghost" type="button" data-i18n="login.register"></button>
        <button id="login-submit" class="btn" type="button" data-i18n="login.submit"></button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal-backdrop" hidden>
    <div class="modal panel">
      <h2 data-i18n="profile.heading"></h2>
      <div id="profile-body"></div>
      <div class="modal-actions">
        <button id="profile-close" class="btn btn-ghost" type="button" data-i18n="profile.close"></button>
      </div>
    </div>
  </div>

  <script type="module">
    import { ERAS, loadEra } from './shared/era-registry.js';
    import { getCurrentUser, onUserChange, registerUser, loginUser, logoutUser } from './shared/auth.js';
    import { createDefaultCharacter, setArchetype, setBase, setSlotOption, renderCharacterSVG, saveCharacter, loadCharacter, findArchetype } from './shared/character.js';
    import { getEraProgress } from './shared/achievements.js';
    import { getEraStats } from './shared/stats.js';
    import { getStreak } from './shared/streaks.js';
    import { t, localize, loadStrings, getLanguage, setLanguage, onLanguageChange } from './shared/i18n.js';
    import { getLocalDailyResult, todayDateKey, hasPlayedToday } from './shared/daily-challenge.js';
    import { mountAtmosphereBackground } from './shared/atmosphere-bg.js';

    mountAtmosphereBackground();

    const heroSection = document.querySelector('.hero');
    const eraScreen = document.querySelector('#era-screen');
    const eraGrid = document.querySelector('#era-grid');
    const archetypeScreen = document.querySelector('#archetype-screen');
    const archetypeHeading = document.querySelector('#archetype-heading');
    const archetypeGrid = document.querySelector('#archetype-grid');
    const appearanceScreen = document.querySelector('#appearance-screen');
    const appearanceHeading = document.querySelector('#appearance-heading');
    const characterPreview = document.querySelector('#character-preview');
    const baseOptions = document.querySelector('#base-options');
    const slotOptions = document.querySelector('#slot-options');

    let currentEra = null;
    let currentCharacter = null;
    let currentPhase = 'era';
    let currentMode = 'free';
    let eraThemePreviews = {};

    // Lightweight fetch of just era.json (skips cards.json) so the era-select
    // screen can show each era's own accent/texture without waiting on its
    // full card deck.
    async function loadEraThemePreviews() {
      const availableEras = ERAS.filter(era => era.available);
      const entries = await Promise.all(availableEras.map(async meta => {
        const era = await fetch(meta.configPath).then(response => response.json());
        return [meta.id, era.theme];
      }));
      return Object.fromEntries(entries);
    }

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelector('#lang-en').className = getLanguage() === 'en' ? 'lang-btn active' : 'lang-btn';
      document.querySelector('#lang-es').className = getLanguage() === 'es' ? 'lang-btn active' : 'lang-btn';
      document.querySelector('#hero-title').innerHTML = `${t('home.heroTitlePart1')} <em class="hero-title-em">${t('home.heroTitlePart2')}</em>`;
    }

    function renderEraGrid() {
      const today = todayDateKey();
      eraGrid.innerHTML = ERAS.map((era, index) => {
        const playedToday = era.available && hasPlayedToday(getLocalDailyResult(era.id), today);
        const preview = eraThemePreviews[era.id];
        // Only the texture *shape* still varies by era (kept as one of the
        // few things -- name, icon, texture -- that distinguish a card);
        // its color always resolves to the single global accent now, so no
        // --card-accent/--texture-tint is set here anymore.
        const cardStyle = preview
          ? `--card-texture-image:${preview.textureImage || 'none'};--card-texture-size:${preview.textureSize || 'auto'};animation-delay:${index * 0.06}s`
          : `animation-delay:${index * 0.06}s`;
        return `
          <div class="era-card panel${era.available ? '' : ' unavailable'}" data-era="${era.id}" style="${cardStyle}">
            <div class="era-card-art"><span class="era-icon">${era.icon}</span></div>
            <div class="era-card-body">
              <h3>${localize(era.name)}</h3>
              <p>${era.available ? localize(era.tagline) : t('era.comingSoon')}</p>
              ${era.available ? `
                <div class="era-card-actions">
                  <button class="btn" type="button" data-action="free" data-era="${era.id}">${t('era.playFree')}</button>
                  <button class="btn btn-ghost${playedToday ? ' daily-played' : ''}" type="button" data-action="daily" data-era="${era.id}">${playedToday ? '✓ ' : ''}${t('era.dailyChallenge')}</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
      eraGrid.querySelectorAll('[data-action="free"]').forEach(btn => {
        btn.addEventListener('click', () => selectEra(btn.dataset.era));
      });
      eraGrid.querySelectorAll('[data-action="daily"]').forEach(btn => {
        btn.addEventListener('click', () => selectDailyChallenge(btn.dataset.era));
      });
    }

    async function selectEra(eraId) {
      const { era } = await loadEra(eraId);
      currentEra = era;
      currentCharacter = loadCharacter(eraId) || createDefaultCharacter(era);
      currentMode = 'free';
      currentPhase = 'archetype';
      heroSection.hidden = true;
      eraScreen.hidden = true;
      archetypeScreen.hidden = false;
      renderArchetypeScreen();
    }

    async function selectDailyChallenge(eraId) {
      if (hasPlayedToday(getLocalDailyResult(eraId), todayDateKey())) {
        window.location.href = `./game.html?era=${eraId}&daily=1`;
        return;
      }
      const { era } = await loadEra(eraId);
      currentEra = era;
      currentCharacter = loadCharacter(eraId) || createDefaultCharacter(era);
      currentMode = 'daily';
      currentPhase = 'archetype';
      heroSection.hidden = true;
      eraScreen.hidden = true;
      archetypeScreen.hidden = false;
      renderArchetypeScreen();
    }

    function modeBadgeHtml() {
      return currentMode === 'daily' ? `<span class="daily-badge">${t('daily.badge')}</span><br>` : '';
    }

    function renderArchetypeScreen() {
      archetypeHeading.innerHTML = `${modeBadgeHtml()}${t('archetype.heading')} — ${localize(currentEra.name)}`;
      archetypeGrid.innerHTML = currentEra.archetypes.map(archetype => `
        <button class="era-card panel${currentCharacter.archetypeId === archetype.id ? ' selected' : ''}" type="button" data-archetype="${archetype.id}">
          <h3>${localize(archetype.name)}</h3>
          <p>${localize(archetype.description)}</p>
        </button>
      `).join('');
      archetypeGrid.querySelectorAll('.era-card').forEach(card => {
        card.addEventListener('click', () => {
          currentCharacter = setArchetype(currentCharacter, card.dataset.archetype);
          renderArchetypeScreen();
        });
      });
    }

    document.querySelector('#archetype-back').addEventListener('click', () => {
      currentPhase = 'era';
      archetypeScreen.hidden = true;
      heroSection.hidden = false;
      eraScreen.hidden = false;
    });

    document.querySelector('#archetype-next').addEventListener('click', () => {
      currentPhase = 'appearance';
      archetypeScreen.hidden = true;
      appearanceScreen.hidden = false;
      renderAppearanceScreen();
    });

    function renderAppearanceScreen() {
      appearanceHeading.innerHTML = `${modeBadgeHtml()}${t('appearance.heading')} — ${localize(currentEra.name)}`;
      characterPreview.innerHTML = renderCharacterSVG(currentEra, currentCharacter);

      baseOptions.innerHTML = `<h4>${t('appearance.baseLabel')}</h4><div class="swatch-row" id="base-swatches"></div>`;
      const baseSwatches = baseOptions.querySelector('#base-swatches');
      currentEra.character.bases.forEach(base => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch-btn' + (currentCharacter.base === base.id ? ' selected' : '');
        btn.textContent = localize(base.label);
        btn.addEventListener('click', () => { currentCharacter = setBase(currentCharacter, base.id); renderAppearanceScreen(); });
        baseSwatches.appendChild(btn);
      });

      slotOptions.innerHTML = '';
      currentEra.character.slots.forEach(slot => {
        const row = document.createElement('div');
        row.className = 'option-row';
        row.innerHTML = `<h4>${localize(slot.label)}</h4><div class="swatch-row"></div>`;
        const swatchRow = row.querySelector('.swatch-row');
        slot.options.forEach(option => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'swatch-btn' + (currentCharacter.slots[slot.id] === option.id ? ' selected' : '');
          btn.textContent = localize(option.label);
          btn.addEventListener('click', () => { currentCharacter = setSlotOption(currentCharacter, slot.id, option.id); renderAppearanceScreen(); });
          swatchRow.appendChild(btn);
        });
        slotOptions.appendChild(row);
      });
    }

    document.querySelector('#appearance-back').addEventListener('click', () => {
      currentPhase = 'archetype';
      appearanceScreen.hidden = true;
      archetypeScreen.hidden = false;
      renderArchetypeScreen();
    });

    document.querySelector('#appearance-begin').addEventListener('click', () => {
      saveCharacter(currentEra.id, currentCharacter);
      const dailyParam = currentMode === 'daily' ? '&daily=1' : '';
      window.location.href = `./game.html?era=${currentEra.id}${dailyParam}`;
    });

    // Hero CTAs just jump to the era grid -- there's no separate "start" page,
    // the cards below are the beginning.
    function scrollToEraGrid(event) {
      event.preventDefault();
      eraGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.querySelector('#hero-cta').addEventListener('click', scrollToEraGrid);
    document.querySelector('#hero-cta-nav').addEventListener('click', scrollToEraGrid);
    document.querySelector('.nav-link.active').addEventListener('click', event => { event.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

    // Language selector
    document.querySelector('#lang-en').addEventListener('click', () => setLanguage('en'));
    document.querySelector('#lang-es').addEventListener('click', () => setLanguage('es'));
    onLanguageChange(() => {
      applyStaticI18n();
      if (currentPhase === 'era') renderEraGrid();
      else if (currentPhase === 'archetype') renderArchetypeScreen();
      else if (currentPhase === 'appearance') renderAppearanceScreen();
    });

    // Login modal
    const loginModal = document.querySelector('#login-modal');
    const loginError = document.querySelector('#login-error');
    document.querySelector('#login-open').addEventListener('click', () => { loginError.textContent = ''; loginModal.hidden = false; });
    document.querySelector('#login-close').addEventListener('click', () => { loginModal.hidden = true; });
    document.querySelector('#logout').addEventListener('click', () => logoutUser());
    document.querySelector('#login-submit').addEventListener('click', () => submitLogin(loginUser));
    document.querySelector('#login-register').addEventListener('click', () => submitLogin(registerUser));

    async function submitLogin(action) {
      const username = document.querySelector('#login-username').value;
      const password = document.querySelector('#login-password').value;
      loginError.textContent = '';
      try {
        await action(username, password);
        loginModal.hidden = true;
      } catch (error) {
        loginError.textContent = error.code === 'auth/invalid-username' ? t('login.errorUsername') : t('login.errorGeneric');
      }
    }

    onUserChange(user => {
      document.querySelector('#player-name').hidden = !user;
      document.querySelector('#player-name').textContent = user ? user.displayName : '';
      document.querySelector('#login-open').hidden = !!user;
      document.querySelector('#logout').hidden = !user;
    });

    // Profile modal
    const profileModal = document.querySelector('#profile-modal');
    const profileBody = document.querySelector('#profile-body');
    document.querySelector('#profile-open').addEventListener('click', async () => {
      profileBody.innerHTML = '<p>…</p>';
      profileModal.hidden = false;
      const streak = getStreak();
      const streakHtml = streak.currentStreak > 0
        ? `<p class="streak-banner">${t('profile.streak', { count: streak.currentStreak, best: streak.longestStreak })}</p>`
        : `<p class="app-subtitle">${t('profile.streakNone')}</p>`;
      const availableEras = ERAS.filter(era => era.available);
      const sections = await Promise.all(availableEras.map(async meta => {
        const { era } = await loadEra(meta.id);
        const progress = getEraProgress(meta.id);
        const stats = getEraStats(meta.id);
        const achievementsHtml = (era.metaAchievements || []).map(achievement => {
          const unlocked = progress.achievementsUnlocked.includes(achievement.id);
          const total = progress.accumulated[achievement.accumulates] || 0;
          return `<li class="${unlocked ? 'complete' : ''}"><span class="objective-mark">${unlocked ? '✓' : '•'}</span> ${localize(achievement.title)} — ${Math.min(total, achievement.threshold)}/${achievement.threshold}</li>`;
        }).join('');
        return `
          <div class="option-row">
            <h4>${localize(era.name)}</h4>
            <p class="app-subtitle">${t('profile.daysPlayed', { count: stats.daysPlayed, objectives: stats.objectivesCompleted })}</p>
            <ul class="objective-list">${achievementsHtml || `<li>${t('profile.noAchievements')}</li>`}</ul>
          </div>
        `;
      }));
      profileBody.innerHTML = streakHtml + (sections.join('') || `<p>${t('profile.noEras')}</p>`);
    });
    document.querySelector('#profile-close').addEventListener('click', () => { profileModal.hidden = true; });

    function applyCardPreview(eraId, preview) {
      const card = eraGrid.querySelector(`.era-card[data-era="${eraId}"]`);
      if (!card || !preview) return;
      card.style.setProperty('--card-texture-image', preview.textureImage || 'none');
      card.style.setProperty('--card-texture-size', preview.textureSize || 'auto');
    }

    (async function init() {
      // Render the grid the instant strings are ready -- don't make the
      // first paint wait on the (non-critical) per-era accent/texture
      // previews, which used to add several extra network round trips
      // before any card appeared at all.
      await loadStrings();
      applyStaticI18n();
      renderEraGrid();
      loadEraThemePreviews()
        .then(previews => {
          eraThemePreviews = previews;
          Object.entries(previews).forEach(([eraId, preview]) => applyCardPreview(eraId, preview));
        })
        .catch(error => console.warn('OneDay: could not load era theme previews', error));
    })();
  </script>
</body>
</html>
