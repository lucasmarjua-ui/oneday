<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneDay: live one real day from history, decision by decision, and find every ending.">
  <meta name="theme-color" content="#120e18">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OneDay">
  <meta property="og:description" content="Live one real day from history, decision by decision, and find every ending.">
  <meta property="og:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://lucasmarjua-ui.github.io/oneday/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OneDay">
  <meta name="twitter:description" content="Live one real day from history, decision by decision, and find every ending.">
  <meta name="twitter:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <title>OneDay</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="./shared/game.css">
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="vignette"></div>

  <header class="topbar">
    <button class="rank-chip frame-sm" type="button" id="rank-chip">
      <span class="rank-chip-medal" id="rank-chip-medal"></span>
      <span class="rank-chip-text">
        <span class="t8 soft" id="rank-chip-xp"></span>
        <span class="t8 rank-chip-name" id="rank-chip-name"></span>
        <span class="rank-chip-bar"><span id="rank-chip-fill"></span></span>
      </span>
    </button>
    <div class="chip-row">
      <button class="btn" type="button" id="how-open" data-i18n="nav.howItWorks"></button>
      <button class="btn" type="button" id="archive-open"><span id="archive-icon"></span><span data-i18n="nav.archive"></span></button>
      <span class="frame-sm t16 player-name" style="padding:8px 10px" id="player-name" hidden></span>
      <button class="btn" type="button" id="login-open" data-i18n="nav.login"></button>
      <button class="btn" type="button" id="logout" hidden data-i18n="nav.logout"></button>
      <span class="frame-sm lang-switch">
        <button type="button" id="lang-en">EN</button>
        <button type="button" id="lang-es">ES</button>
      </span>
    </div>
  </header>

  <main class="title-screen">
    <div class="logo-block">
      <h1 class="logo">OneDay</h1>
      <p class="logo-sub" id="hero-title"></p>
    </div>
    <div></div>
    <section class="picker frame" id="eras" aria-labelledby="picker-heading">
      <h2 class="sr-only" id="picker-heading" data-i18n="home.indexHeading"></h2>
      <div class="picker-row">
        <button class="btn btn-icon" type="button" id="prev-era" aria-label="Previous era"><span class="flip" id="prev-icon"></span></button>
        <div class="picker-era" aria-live="polite">
          <span class="t8 soft" data-i18n="home.pressStart"></span> <span class="t8" style="color:var(--gold)" id="picker-year"></span>
          <h3 class="picker-name" id="picker-name"></h3>
          <p class="picker-tagline" id="picker-tagline"></p>
          <p class="t8 picker-progress" id="picker-progress"></p>
        </div>
        <button class="btn btn-icon" type="button" id="next-era" aria-label="Next era"><span id="next-icon"></span></button>
      </div>
      <div class="timeline" id="timeline" role="tablist" aria-label="Events"></div>
      <div class="menu">
        <button class="btn btn-primary" type="button" id="play-era"><span id="play-icon"></span><span data-i18n="era.live"></span></button>
        <button class="btn daily-btn" type="button" id="play-daily">
          <span id="star-icon"></span>
          <span class="daily-text"><span data-i18n="daily.featured"></span> <span class="daily-event" id="daily-event"></span></span>
          <span class="daily-streak" id="daily-streak" hidden><span id="flame-icon"></span><span id="daily-streak-count"></span></span>
        </button>
      </div>
      <p class="t8 daily-hint" id="daily-hint"></p>
      <p class="stats-line t8">
        <b id="stat-eras">–</b> <span data-i18n="home.statsEras"></span> ·
        <b id="stat-cards">161</b> <span data-i18n="home.statsCards"></span> ·
        <b id="stat-tests">247</b> <span data-i18n="home.statsTests"></span> ·
        <span data-i18n="home.indexHint"></span>
      </p>
    </section>
  </main>

  <div id="how-modal" class="modal-backdrop" hidden>
    <div class="modal frame" role="dialog" aria-modal="true" aria-labelledby="how-heading">
      <h2 id="how-heading" data-i18n="home.howHeading"></h2>
      <p class="soft" data-i18n="home.lede"></p>
      <div class="how-step">
        <div class="how-step-n">01</div>
        <h3 data-i18n="home.step1Title"></h3>
        <p data-i18n="home.step1Desc"></p>
      </div>
      <div class="how-step">
        <div class="how-step-n">02</div>
        <h3 data-i18n="home.step2Title"></h3>
        <p data-i18n="home.step2Desc"></p>
      </div>
      <div class="how-step">
        <div class="how-step-n">03</div>
        <h3 data-i18n="home.step3Title"></h3>
        <p data-i18n="home.step3Desc"></p>
      </div>
      <div class="how-step">
        <div class="how-step-n">04</div>
        <h3 data-i18n="home.step4Title"></h3>
        <p data-i18n="home.step4Desc"></p>
      </div>
      <p class="muted t8" data-i18n="home.footer"></p>
      <div class="modal-actions">
        <button id="how-close" class="btn" type="button" data-i18n="profile.close"></button>
      </div>
    </div>
  </div>

  <div id="login-modal" class="modal-backdrop" hidden>
    <div class="modal frame" role="dialog" aria-modal="true">
      <h2 data-i18n="login.heading"></h2>
      <p class="soft" data-i18n="login.description"></p>
      <div class="field">
        <label class="t8 soft" for="login-username" data-i18n="login.username"></label>
        <input id="login-username" type="text" autocomplete="username" maxlength="16">
      </div>
      <div class="field">
        <label class="t8 soft" for="login-password" data-i18n="login.password"></label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="modal-actions">
        <button id="login-close" class="btn" type="button" data-i18n="login.cancel"></button>
        <button id="login-register" class="btn" type="button" data-i18n="login.register"></button>
        <button id="login-submit" class="btn btn-primary" type="button" data-i18n="login.submit"></button>
      </div>
    </div>
  </div>

  <div id="archive-modal" class="modal-backdrop" hidden>
    <div class="modal modal-wide frame" role="dialog" aria-modal="true" aria-labelledby="archive-heading">
      <div class="archive-head">
        <h2 id="archive-heading" data-i18n="nav.archive"></h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="career" data-i18n="archive.tabCareer"></button>
          <button type="button" role="tab" data-tab="events" data-i18n="archive.tabEvents"></button>
          <button type="button" role="tab" data-tab="facts" data-i18n="archive.tabFacts"></button>
        </div>
      </div>
      <div id="archive-body" class="archive-body"></div>
      <div class="modal-actions">
        <button id="archive-close" class="btn" type="button" data-i18n="profile.close"></button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="t24">OneDay</div>
    <div class="loading-bar"><span id="loading-fill"></span></div>
  </div>

  <div class="studio" id="studio" hidden>
    <div class="studio-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="t16">Lucas Martinez</div>
    <div class="t8 soft" data-i18n="home.presents"></div>
  </div>

  <script type="module">
    import { erasByDate, loadEra } from './shared/era-registry.js';
    import { getCurrentUser, onUserChange, registerUser, loginUser, logoutUser } from './shared/auth.js';
    import { getEraProgress } from './shared/achievements.js';
    import { getEraStats } from './shared/stats.js';
    import { getStreak } from './shared/streaks.js';
    import { getProgress } from './shared/progress.js';
    import { completion } from './shared/progress-logic.js';
    import { t, localize, loadStrings, getLanguage, setLanguage, onLanguageChange } from './shared/i18n.js';
    import { getLocalDailyResult, todayDateKey, hasPlayedToday, featuredEventFor } from './shared/daily-challenge.js';
    import { getCareer } from './shared/career.js';
    import { rankFor, MEDALS } from './shared/career-logic.js';
    import { medalTile, rankBlock, animateXpBars } from './shared/ui/career-ui.js';
    import { sfx } from './shared/stage/sfx.js';
    import { music } from './shared/stage/music.js';
    import { icon } from './shared/ui/icons.js';
    import { wipeIn, wipeOut, setLoading, finishLoading } from './shared/ui/screens.js';

    // The events in the order they happened, as a timeline.
    const availableEras = erasByDate();
    const SELECTED_KEY = 'oneday.selectedEra';

    // The era count is read from the registry rather than typed in, so the
    // number on the page can never drift from the number of eras that exist.
    document.querySelector('#stat-eras').textContent = availableEras.length;

    let selected = 0;
    try {
      const saved = availableEras.findIndex(era => era.id === localStorage.getItem(SELECTED_KEY));
      if (saved >= 0) selected = saved;
    } catch {
      // No storage: start on the first era.
    }

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelector('#lang-en').className = getLanguage() === 'en' ? 'active' : '';
      document.querySelector('#lang-es').className = getLanguage() === 'es' ? 'active' : '';
      document.querySelector('#hero-title').innerHTML = `${t('home.heroTitlePart1')} <em>${t('home.heroTitlePart2')}</em>`;
    }

    document.querySelector('#prev-icon').innerHTML = icon('play', 3);
    document.querySelector('#next-icon').innerHTML = icon('play', 3);
    document.querySelector('#play-icon').innerHTML = icon('play', 3);
    document.querySelector('#star-icon').innerHTML = icon('star', 3);
    document.querySelector('#flame-icon').innerHTML = icon('flame', 2);
    document.querySelector('#archive-icon').innerHTML = icon('book', 2);
    document.querySelector('#rank-chip-medal').innerHTML = icon('medal', 3);

    // --- The player's rank, top left: always in sight, one click to the archive ---
    function renderRankChip() {
      const career = getCareer();
      const { rank, progress } = rankFor(career.xp);
      document.querySelector('#rank-chip-name').textContent = localize(rank.name);
      document.querySelector('#rank-chip-xp').textContent = t('career.xp', { xp: career.xp });
      document.querySelector('#rank-chip-fill').style.width = `${Math.round(progress * 100)}%`;
    }

    // --- Today's challenge: one featured event, the same for everyone ---
    const featuredId = () => featuredEventFor(todayDateKey(), availableEras.map(era => era.id));
    function renderDaily() {
      const id = featuredId();
      const meta = availableEras.find(era => era.id === id);
      const played = hasPlayedToday(getLocalDailyResult(id), todayDateKey());
      document.querySelector('#daily-event').textContent = meta ? `· ${localize(meta.name)}` : '';
      document.querySelector('#play-daily').classList.toggle('played', played);
      document.querySelector('#daily-hint').textContent = played ? t('daily.featuredDone') : t('daily.featuredHint');
      const streak = getStreak();
      document.querySelector('#daily-streak').hidden = !streak.currentStreak;
      document.querySelector('#daily-streak-count').textContent = streak.currentStreak;
      document.querySelector('#daily-streak').title = t('daily.streakShort', { count: streak.currentStreak });
    }

    async function play(eraId, daily = false) {
      sfx.select();
      music.stop();
      await wipeIn();
      window.location.href = `./game.html?era=${eraId}${daily ? '&daily=1' : ''}`;
    }

    // --- The diorama behind the menu: one live 3D island per era ---
    let stage = null;
    let stageEra = null;
    let createStage = null;
    let stageQueue = Promise.resolve();

    function showStage(eraId) {
      stageQueue = stageQueue.then(async () => {
        if (stageEra === eraId || !createStage) return;
        stageEra = eraId;
        const host = document.querySelector('#stage');
        const previous = stage;
        stage = await createStage(host, { eraId, mode: 'showcase' });
        previous?.dispose();
      }).catch(error => {
        console.warn('OneDay: 3D stage unavailable', error);
        document.body.classList.add('no-stage');
      });
    }

    // How much of each event the player has uncovered: endings and facts.
    const loadedEvents = new Map();
    function eventData(eraId) {
      if (!loadedEvents.has(eraId)) loadedEvents.set(eraId, loadEra(eraId));
      return loadedEvents.get(eraId);
    }
    async function renderProgress(eraId) {
      const el = document.querySelector('#picker-progress');
      try {
        const { era, cards } = await eventData(eraId);
        if (availableEras[selected].id !== eraId) return;
        const done = completion(getProgress(eraId), era, cards);
        completionCache.set(eraId, done);
        el.textContent = t('home.progress', { found: done.endings, total: done.totalEndings, facts: done.facts, totalFacts: done.totalFacts });
      } catch {
        el.textContent = '';
      }
    }

    function renderPicker() {
      const era = availableEras[selected];
      document.body.dataset.era = era.id;
      document.querySelector('#picker-year').textContent = `${localize(era.year)} · ${localize(era.place)}`;
      renderProgress(era.id);
      document.querySelector('#picker-name').textContent = localize(era.name);
      document.querySelector('#picker-tagline').textContent = localize(era.tagline);
      renderTimeline();
      try { localStorage.setItem(SELECTED_KEY, era.id); } catch { /* not remembered */ }
      showStage(era.id);
    }

    function select(index) {
      selected = (index + availableEras.length) % availableEras.length;
      sfx.move();
      renderPicker();
    }

    document.querySelector('#prev-era').addEventListener('click', () => select(selected - 1));
    document.querySelector('#next-era').addEventListener('click', () => select(selected + 1));
    // One stop per event on the timeline, with how much of it is uncovered.
    function renderTimeline() {
      document.querySelector('#timeline').innerHTML = availableEras.map((entry, index) => {
        const done = completionCache.get(entry.id);
        const pct = done ? Math.round(((done.endings + done.facts) / Math.max(1, done.totalEndings + done.totalFacts)) * 100) : 0;
        return `<button type="button" role="tab" aria-selected="${index === selected}" class="stop${index === selected ? ' active' : ''}" data-index="${index}">
          <span class="t8 stop-year">${entry.sortYear < 0 ? localize(entry.year) : entry.sortYear}</span>
          <span class="t8 stop-name">${localize(entry.name)}</span>
          <span class="stop-bar"><span style="width:${pct}%"></span></span>
        </button>`;
      }).join('');
    }
    const completionCache = new Map();

    document.querySelector('#timeline').addEventListener('click', event => {
      const dot = event.target.closest('[data-index]');
      if (dot) select(Number(dot.dataset.index));
    });
    document.querySelector('#play-era').addEventListener('click', () => play(availableEras[selected].id));
    document.querySelector('#play-daily').addEventListener('click', () => play(featuredId(), true));

    document.addEventListener('keydown', event => {
      if (event.target.closest('input') || document.querySelector('.modal-backdrop:not([hidden])')) return;
      if (event.key === 'ArrowLeft') select(selected - 1);
      else if (event.key === 'ArrowRight') select(selected + 1);
      else if (event.key === 'Enter' && event.target === document.body) play(availableEras[selected].id);
    });

    document.querySelector('#lang-en').addEventListener('click', () => setLanguage('en'));
    document.querySelector('#lang-es').addEventListener('click', () => setLanguage('es'));
    onLanguageChange(() => { applyStaticI18n(); renderPicker(); renderRankChip(); renderDaily(); if (!archiveModal.hidden) renderArchive(); });

    const howModal = document.querySelector('#how-modal');
    document.querySelector('#how-open').addEventListener('click', () => { howModal.hidden = false; });
    document.querySelector('#how-close').addEventListener('click', () => { howModal.hidden = true; });

    const loginModal = document.querySelector('#login-modal');
    const loginError = document.querySelector('#login-error');
    document.querySelector('#login-open').addEventListener('click', () => { loginError.textContent = ''; loginModal.hidden = false; });
    document.querySelector('#login-close').addEventListener('click', () => { loginModal.hidden = true; });
    document.querySelector('#logout').addEventListener('click', () => logoutUser());
    document.querySelector('#login-submit').addEventListener('click', () => submitLogin(loginUser));
    document.querySelector('#login-register').addEventListener('click', () => submitLogin(registerUser));

    async function submitLogin(action) {
      const username = document.querySelector('#login-username').value;
      const password = document.querySelector('#login-password').value;
      loginError.textContent = '';
      try {
        await action(username, password);
        loginModal.hidden = true;
      } catch (error) {
        loginError.textContent = error.code === 'auth/invalid-username' ? t('login.errorUsername') : t('login.errorGeneric');
      }
    }

    onUserChange(user => {
      document.querySelector('#player-name').hidden = !user;
      document.querySelector('#player-name').textContent = user ? user.displayName : '';
      document.querySelector('#login-open').hidden = !!user;
      document.querySelector('#logout').hidden = !user;
    });

    // --- The archive: career and medals, every event's endings, every fact ---
    const archiveModal = document.querySelector('#archive-modal');
    const archiveBody = document.querySelector('#archive-body');
    let archiveTab = 'career';
    let factsEvent = null;

    async function renderArchive() {
      document.querySelectorAll('#archive-modal [data-tab]').forEach(button => {
        button.classList.toggle('active', button.dataset.tab === archiveTab);
        button.setAttribute('aria-selected', String(button.dataset.tab === archiveTab));
      });
      const strings = { localize, t };
      const all = await Promise.all(availableEras.map(async meta => ({ meta, ...(await eventData(meta.id)), progress: getProgress(meta.id) })));
      if (archiveTab === 'career') {
        const career = getCareer();
        const streak = getStreak();
        const endings = all.reduce((total, entry) => total + completion(entry.progress, entry.era, entry.cards).endings, 0);
        const totalEndings = all.reduce((total, entry) => total + (entry.era.endings || []).length, 0);
        const facts = all.reduce((total, entry) => total + completion(entry.progress, entry.era, entry.cards).facts, 0);
        const totalFacts = all.reduce((total, entry) => total + entry.cards.filter(card => card.fact).length, 0);
        const stat = (label, value) => `<div class="stat-tile"><span class="stat-value">${value}</span><span class="t8 soft">${label}</span></div>`;
        archiveBody.innerHTML = `
          ${rankBlock(career.xp, strings, { from: 0 })}
          <div class="stat-grid">
            ${stat(t('archive.statDays'), career.days)}
            ${stat(t('archive.statEndings'), `${endings}/${totalEndings}`)}
            ${stat(t('archive.statFacts'), `${facts}/${totalFacts}`)}
            ${stat(t('archive.statQuiz'), `${career.quizCorrect}/${career.quizAnswered}`)}
            ${stat(t('archive.statStreak'), streak.longestStreak || 0)}
          </div>
          <div class="col-head t8">${t('medals.heading')} · ${t('medals.count', { n: career.medals.length, total: MEDALS.length })}</div>
          <div class="medal-grid">${MEDALS.map(medal => medalTile(medal, career.medals.includes(medal.id), strings)).join('')}</div>
        `;
        animateXpBars(archiveBody);
      } else if (archiveTab === 'events') {
        archiveBody.innerHTML = `<div class="event-grid">${all.map(({ meta, era, cards, progress }) => {
          const done = completion(progress, era, cards);
          const stats = getEraStats(meta.id);
          const endings = (era.endings || []).map(ending => progress.endings.includes(ending.id)
            ? `<li class="found"><span class="mark">${ending.historical ? '★' : '◆'}</span>${localize(ending.title)}${ending.historical ? ` <span class="new-tag t8 hist">${t('archive.historical')}</span>` : ''}</li>`
            : `<li class="locked"><span class="mark">·</span>${t('archive.locked')}</li>`).join('');
          return `<section class="event-card" style="--accent-h:${meta.accent}">
            <span class="t8 event-year">${localize(meta.year)} · ${localize(meta.place)}</span>
            <h3>${localize(meta.name)}</h3>
            <p class="t8 soft">${t('archive.daysHere', { count: stats.daysPlayed })} · ${t('archive.factsCount', { found: done.facts, total: done.totalFacts })}</p>
            <span class="stop-bar"><span style="width:${Math.round((done.facts / Math.max(1, done.totalFacts)) * 100)}%"></span></span>
            <div class="t8 soft event-sub">${t('archive.endings')} · ${done.endings}/${done.totalEndings}</div>
            <ul class="ending-list">${endings}</ul>
            ${(era.metaAchievements || []).length ? `<div class="t8 soft event-sub">${t('archive.challenges')}</div><ul class="challenge-list">${era.metaAchievements.map(achievement => {
              const record = getEraProgress(meta.id);
              const won = record.achievementsUnlocked.includes(achievement.id);
              const total = Math.min(record.accumulated[achievement.accumulates] || 0, achievement.threshold);
              return `<li class="${won ? 'won' : ''}" title="${localize(achievement.description)}"><span>${won ? '✓' : '·'} ${localize(achievement.title)}</span><span class="stop-bar"><span style="width:${Math.round((total / achievement.threshold) * 100)}%"></span></span><b>${total}/${achievement.threshold}</b></li>`;
            }).join('')}</ul>` : ''}
          </section>`;
        }).join('')}</div>`;
      } else {
        factsEvent = factsEvent || availableEras[selected].id;
        const entry = all.find(item => item.meta.id === factsEvent) || all[0];
        const chips = all.map(item => `<button type="button" class="chip${item.meta.id === entry.meta.id ? ' active' : ''}" data-facts="${item.meta.id}">${localize(item.meta.name)}</button>`).join('');
        const withFacts = entry.cards.filter(card => card.fact);
        const found = withFacts.filter(card => entry.progress.facts.includes(card.id));
        const hidden = withFacts.length - found.length;
        const list = found.map(card => `<li><span class="mark">${icon('scroll', 1)}</span><span>${localize(card.fact)}</span></li>`).join('');
        const locks = hidden ? `<div class="codex-hidden"><div class="lock-row">${Array.from({ length: hidden }, () => icon('lock', 2)).join('')}</div><p class="t8 soft">${t('archive.hiddenFacts', { count: hidden })}</p></div>` : '';
        archiveBody.innerHTML = `<div class="chip-row wrap">${chips}</div><p class="t8 soft">${t('archive.factsCount', { found: found.length, total: withFacts.length })}</p><ul class="codex">${list}</ul>${locks}`;
      }
    }

    function openArchive(tab = 'career') {
      archiveTab = tab;
      archiveModal.hidden = false;
      archiveBody.innerHTML = `<p class="muted small">…</p>`;
      sfx.select();
      renderArchive();
    }
    document.querySelector('#archive-open').addEventListener('click', () => openArchive('career'));
    document.querySelector('#rank-chip').addEventListener('click', () => openArchive('career'));
    document.querySelector('#archive-close').addEventListener('click', () => { archiveModal.hidden = true; });
    document.querySelector('#archive-modal .tabs').addEventListener('click', event => {
      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      archiveTab = tab.dataset.tab;
      sfx.move();
      renderArchive();
    });
    archiveBody.addEventListener('click', event => {
      const chip = event.target.closest('[data-facts]');
      if (!chip) return;
      factsEvent = chip.dataset.facts;
      sfx.move();
      renderArchive();
    });

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', event => { if (event.target === backdrop) backdrop.hidden = true; });
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelectorAll('.modal-backdrop').forEach(backdrop => { backdrop.hidden = true; });
    });

    // A studio card on the first visit of a session, like a game boot.
    function showStudioCard() {
      let seen = false;
      try { seen = sessionStorage.getItem('oneday.studio') === '1'; sessionStorage.setItem('oneday.studio', '1'); } catch { /* show it */ }
      if (seen || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const studio = document.querySelector('#studio');
      studio.hidden = false;
      const close = () => studio.remove();
      studio.addEventListener('click', close);
      setTimeout(close, 2700);
    }

    (async function init() {
      setLoading(0.2);
      await loadStrings();
      applyStaticI18n();
      showStudioCard();
      setLoading(0.5);
      try {
        ({ createStage } = await import('./shared/stage/stage.js'));
      } catch (error) {
        console.warn('OneDay: 3D stage unavailable', error);
        document.body.classList.add('no-stage');
      }
      setLoading(0.8);
      renderPicker();
      renderRankChip();
      renderDaily();
      Promise.all(availableEras.map(era => eventData(era.id)))
        .then(all => {
          document.querySelector('#stat-cards').textContent = all.reduce((sum, { cards }) => sum + cards.length, 0);
          all.forEach(({ era, cards }, index) => completionCache.set(availableEras[index].id, completion(getProgress(availableEras[index].id), era, cards)));
          renderTimeline();
        })
        .catch(() => {});
      await stageQueue;
      setLoading(1);
      finishLoading();
      wipeOut();
      music.play('title');
    })();
  </script>
</body>
</html>
