<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneDay: pick an era, live one day of decisions, and find out who they turn you into.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OneDay">
  <meta property="og:description" content="Pick an era, live one day of decisions, and find out who they turn you into.">
  <meta property="og:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://lucasmarjua-ui.github.io/oneday/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OneDay">
  <meta name="twitter:description" content="Pick an era, live one day of decisions, and find out who they turn you into.">
  <meta name="twitter:image" content="https://lucasmarjua-ui.github.io/oneday/assets/social-preview.png">
  <title>OneDay</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="./shared/theme.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap site-head-inner">
      <a class="wordmark" href="./index.html">OneDay</a>
      <nav class="head-nav">
        <a class="head-link" href="#eras" data-i18n="nav.eras"></a>
        <a class="head-link" href="#how" data-i18n="nav.howItWorks"></a>
        <button class="head-link" type="button" id="profile-open" data-i18n="nav.profile"></button>
        <span class="player-name" id="player-name" hidden></span>
        <button class="head-link" type="button" id="login-open" data-i18n="nav.login"></button>
        <button class="head-link" type="button" id="logout" hidden data-i18n="nav.logout"></button>
        <span class="lang-switch">
          <button type="button" id="lang-en">EN</button>
          <button type="button" id="lang-es">ES</button>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap masthead">
      <div class="masthead-kicker"><span class="mono" data-i18n="home.kicker"></span></div>
      <h1 id="hero-title"></h1>
      <p class="masthead-lede" data-i18n="home.lede"></p>
      <div class="masthead-stats">
        <div class="stat"><div class="stat-value" id="stat-eras">–</div><div class="stat-label" data-i18n="home.statsEras"></div></div>
        <div class="stat"><div class="stat-value" id="stat-cards">211</div><div class="stat-label" data-i18n="home.statsCards"></div></div>
        <div class="stat"><div class="stat-value" id="stat-tests">187</div><div class="stat-label" data-i18n="home.statsTests"></div></div>
      </div>
    </section>

    <section class="wrap" id="eras">
      <div class="index-head">
        <h2 class="mono" data-i18n="home.indexHeading"></h2>
        <span class="mono" data-i18n="home.indexHint"></span>
      </div>
      <ul class="era-index" id="era-index"></ul>
    </section>

    <section class="wrap how" id="how">
      <div class="index-head">
        <h2 class="mono" data-i18n="home.howHeading"></h2>
      </div>
      <div class="how-grid">
        <div class="how-step">
          <div class="how-step-n">01</div>
          <h3 data-i18n="home.step1Title"></h3>
          <p data-i18n="home.step1Desc"></p>
        </div>
        <div class="how-step">
          <div class="how-step-n">02</div>
          <h3 data-i18n="home.step2Title"></h3>
          <p data-i18n="home.step2Desc"></p>
        </div>
        <div class="how-step">
          <div class="how-step-n">03</div>
          <h3 data-i18n="home.step3Title"></h3>
          <p data-i18n="home.step3Desc"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="wrap site-foot">
    <span class="mono">OneDay</span>
    <span class="mono" data-i18n="home.footer"></span>
  </footer>

  <div id="login-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 data-i18n="login.heading"></h2>
      <p class="muted small" data-i18n="login.description"></p>
      <div class="field">
        <label for="login-username" data-i18n="login.username"></label>
        <input id="login-username" type="text" autocomplete="username" maxlength="16">
      </div>
      <div class="field">
        <label for="login-password" data-i18n="login.password"></label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="modal-actions">
        <button id="login-close" class="btn btn-quiet" type="button" data-i18n="login.cancel"></button>
        <button id="login-register" class="btn" type="button" data-i18n="login.register"></button>
        <button id="login-submit" class="btn btn-solid" type="button" data-i18n="login.submit"></button>
      </div>
    </div>
  </div>

  <div id="profile-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 data-i18n="profile.heading"></h2>
      <div id="profile-body"></div>
      <div class="modal-actions">
        <button id="profile-close" class="btn btn-quiet" type="button" data-i18n="profile.close"></button>
      </div>
    </div>
  </div>

  <script type="module">
    import { ERAS, loadEra } from './shared/era-registry.js';
    import { getCurrentUser, onUserChange, registerUser, loginUser, logoutUser } from './shared/auth.js';
    import { getEraProgress } from './shared/achievements.js';
    import { getEraStats } from './shared/stats.js';
    import { getStreak } from './shared/streaks.js';
    import { t, localize, loadStrings, getLanguage, setLanguage, onLanguageChange } from './shared/i18n.js';
    import { getLocalDailyResult, todayDateKey, hasPlayedToday } from './shared/daily-challenge.js';

    const availableEras = ERAS.filter(era => era.available);
    const eraIndex = document.querySelector('#era-index');

    // The era count is read from the registry rather than typed in, so the
    // number on the page can never drift from the number of eras that exist.
    document.querySelector('#stat-eras').textContent = availableEras.length;

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelector('#lang-en').className = getLanguage() === 'en' ? 'active' : '';
      document.querySelector('#lang-es').className = getLanguage() === 'es' ? 'active' : '';
      document.querySelector('#hero-title').innerHTML = `${t('home.heroTitlePart1')} <em>${t('home.heroTitlePart2')}</em>`;
    }

    function play(eraId, daily = false) {
      window.location.href = `./game.html?era=${eraId}${daily ? '&daily=1' : ''}`;
    }

    function renderEraIndex() {
      const today = todayDateKey();
      eraIndex.innerHTML = availableEras.map(era => {
        const playedToday = hasPlayedToday(getLocalDailyResult(era.id), today);
        return `
          <li>
            <button class="era-row" type="button" data-era="${era.id}" style="--row-h:${era.accent}">
              <span class="era-row-year">${localize(era.year)}</span>
              <span>
                <span class="era-row-name">${localize(era.name)}</span>
                <p class="era-row-tagline">${localize(era.tagline)}</p>
              </span>
              <span class="era-row-go">
                <span class="era-row-daily${playedToday ? ' played' : ''}" data-daily="${era.id}" role="button" tabindex="0">${playedToday ? '✓ ' : ''}${t('era.daily')}</span>
                <span>${t('era.live')} →</span>
              </span>
            </button>
          </li>
        `;
      }).join('');

      eraIndex.querySelectorAll('.era-row').forEach(row => {
        row.addEventListener('click', event => {
          const daily = event.target.closest('[data-daily]');
          if (daily) { event.stopPropagation(); play(daily.dataset.daily, true); return; }
          play(row.dataset.era);
        });
      });
      eraIndex.querySelectorAll('[data-daily]').forEach(chip => {
        chip.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); play(chip.dataset.daily, true); }
        });
      });
    }

    renderEraIndex();

    document.querySelector('#lang-en').addEventListener('click', () => setLanguage('en'));
    document.querySelector('#lang-es').addEventListener('click', () => setLanguage('es'));
    onLanguageChange(() => { applyStaticI18n(); renderEraIndex(); });

    const loginModal = document.querySelector('#login-modal');
    const loginError = document.querySelector('#login-error');
    document.querySelector('#login-open').addEventListener('click', () => { loginError.textContent = ''; loginModal.hidden = false; });
    document.querySelector('#login-close').addEventListener('click', () => { loginModal.hidden = true; });
    document.querySelector('#logout').addEventListener('click', () => logoutUser());
    document.querySelector('#login-submit').addEventListener('click', () => submitLogin(loginUser));
    document.querySelector('#login-register').addEventListener('click', () => submitLogin(registerUser));

    async function submitLogin(action) {
      const username = document.querySelector('#login-username').value;
      const password = document.querySelector('#login-password').value;
      loginError.textContent = '';
      try {
        await action(username, password);
        loginModal.hidden = true;
      } catch (error) {
        loginError.textContent = error.code === 'auth/invalid-username' ? t('login.errorUsername') : t('login.errorGeneric');
      }
    }

    onUserChange(user => {
      document.querySelector('#player-name').hidden = !user;
      document.querySelector('#player-name').textContent = user ? user.displayName : '';
      document.querySelector('#login-open').hidden = !!user;
      document.querySelector('#logout').hidden = !user;
    });

    const profileModal = document.querySelector('#profile-modal');
    const profileBody = document.querySelector('#profile-body');
    document.querySelector('#profile-open').addEventListener('click', async () => {
      profileBody.innerHTML = `<p class="muted small">…</p>`;
      profileModal.hidden = false;
      const streak = getStreak();
      const streakHtml = streak.currentStreak > 0
        ? `<p class="streak-line">${t('profile.streak', { count: streak.currentStreak, best: streak.longestStreak })}</p>`
        : `<p class="muted small">${t('profile.streakNone')}</p>`;
      const sections = await Promise.all(availableEras.map(async meta => {
        const { era } = await loadEra(meta.id);
        const progress = getEraProgress(meta.id);
        const stats = getEraStats(meta.id);
        const achievements = (era.metaAchievements || []).map(achievement => {
          const unlocked = progress.achievementsUnlocked.includes(achievement.id);
          const total = progress.accumulated[achievement.accumulates] || 0;
          return `<li class="${unlocked ? 'done' : ''}"><span class="mark">${unlocked ? '✓' : '·'}</span> ${localize(achievement.title)}<span class="val">${Math.min(total, achievement.threshold)}/${achievement.threshold}</span></li>`;
        }).join('');
        return `
          <div class="profile-era">
            <h4>${localize(era.name)}</h4>
            <p class="muted small">${t('profile.daysPlayed', { count: stats.daysPlayed, objectives: stats.objectivesCompleted })}</p>
            <ul class="line-list">${achievements}</ul>
          </div>
        `;
      }));
      profileBody.innerHTML = streakHtml + sections.join('');
    });
    document.querySelector('#profile-close').addEventListener('click', () => { profileModal.hidden = true; });

    (async function init() {
      await loadStrings();
      applyStaticI18n();
      renderEraIndex();
    })();
  </script>
</body>
</html>
