<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneDay: live one decisive day, one decision at a time.">
  <meta name="theme-color" content="#120e18">
  <title>OneDay — Playing</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="./shared/game.css">
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="vignette"></div>

  <header class="topbar">
    <div class="chip-row">
      <a class="btn btn-icon" href="./index.html" id="back-link" aria-label="Eras"><span id="back-icon"></span><span class="sr-only" data-i18n="nav.eras"></span></a>
      <div class="era-title frame-sm">
        <h1 class="t16" id="era-title" style="margin:0;font-weight:400"></h1>
        <span class="badge" id="daily-badge" hidden data-i18n="daily.badge"></span>
      </div>
    </div>

    <div class="clock frame-sm" aria-live="polite">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="t8 soft" id="slot-label"></div>
      <div class="day-track" aria-hidden="true">
        <div class="day-fill" id="day-fill" style="width:0%"></div>
        <div class="day-sun" id="day-sun" style="left:0%"></div>
      </div>
    </div>

    <div class="chip-row">
      <button class="btn btn-icon" type="button" id="menu-open"><span id="menu-icon"></span><span class="sr-only" data-i18n="menu.title"></span></button>
    </div>
  </header>

  <aside class="hud frame" id="hud" aria-label="Status"></aside>

  <div id="banner-host" aria-live="polite"></div>

  <main>
    <section id="decision-screen" class="dialog frame" hidden aria-live="polite">
      <div class="nameplate frame-sm"><span class="t16" id="speaker"></span><span class="t8 soft" id="speaker-role"></span></div>
      <div class="dialog-body">
        <canvas class="portrait" id="portrait" width="16" height="14" aria-hidden="true"></canvas>
        <div class="dialog-main">
          <p class="dialog-text" id="card-text"></p>
          <div class="choices revealing" id="options" role="listbox"></div>
          <div class="dialog-foot t8"><span id="card-meta"></span><span>·</span><span data-i18n="game.keysHint"></span></div>
        </div>
      </div>
    </section>

    <section id="outcome-screen" class="dialog frame" hidden aria-live="polite">
      <div class="dialog-body" style="grid-template-columns:1fr">
        <div class="dialog-main">
          <span class="outcome-tag" id="outcome-tag"></span>
          <p class="dialog-text" id="outcome-text"></p>
          <div class="deltas" id="outcome-deltas"></div>
          <div class="dialog-foot">
            <button id="outcome-continue" class="btn btn-primary" type="button"><span data-i18n="game.continue"></span> <span class="next-indicator" id="next-icon"></span></button>
          </div>
        </div>
      </div>
    </section>

    <div id="reveal" class="reveal" hidden>
      <div class="reveal-kicker t16" id="reveal-kicker"></div>
      <div class="reveal-name" id="reveal-name"></div>
    </div>

    <section id="summary-screen" class="results frame" hidden>
      <div class="results-scroll">
        <div class="verdict">
          <span class="t8 soft" id="verdict-kicker"></span>
          <h2 id="persona-name"></h2>
          <p class="verdict-desc" id="persona-desc"></p>
          <p class="ending-line" id="ending-line"></p>
          <p class="streak-line t16" id="summary-streak" hidden></p>
        </div>

        <div class="score-row" id="summary-score" hidden></div>

        <div class="summary-cols">
          <div>
            <div class="col-head t8" data-i18n="game.objectivesHeading"></div>
            <ul class="line-list" id="summary-objectives"></ul>
            <div id="summary-achievements"></div>
          </div>
          <div>
            <div class="col-head t8" data-i18n="game.resourcesHeading"></div>
            <ul class="line-list" id="summary-resources"></ul>
          </div>
          <div>
            <div class="col-head t8" data-i18n="game.recapHeading"></div>
            <div class="recap" id="summary-log"></div>
          </div>
          <div id="summary-leaderboard-section" hidden>
            <div class="col-head t8" data-i18n="daily.leaderboardHeading"></div>
            <ul class="line-list leaderboard" id="summary-leaderboard"></ul>
          </div>
        </div>

        <p id="summary-comeback" class="muted" hidden data-i18n="daily.comeBackTomorrow"></p>
        <div class="actions-row">
          <button id="play-again" class="btn btn-primary" type="button" data-i18n="game.playAgain"></button>
          <button id="download-card" class="btn" type="button" hidden data-i18n="game.downloadCard"></button>
          <a class="btn" href="./index.html" data-i18n="game.changeEra" data-transition></a>
        </div>
        <canvas id="share-canvas" hidden></canvas>
      </div>
    </section>
  </main>

  <div id="pause" class="modal-backdrop" hidden>
    <div class="modal frame" role="dialog" aria-modal="true" aria-labelledby="pause-heading">
      <h2 id="pause-heading" data-i18n="menu.title"></h2>
      <div class="menu-list">
        <button class="btn btn-primary" type="button" id="menu-resume" data-i18n="menu.resume"></button>
        <button class="btn" type="button" id="menu-music"><span data-i18n="menu.music"></span><span class="menu-value" id="menu-music-value"></span></button>
        <button class="btn" type="button" id="menu-sound"><span data-i18n="menu.sound"></span><span class="menu-value" id="menu-sound-value"></span></button>
        <button class="btn" type="button" id="menu-speed"><span data-i18n="menu.textSpeed"></span><span class="menu-value" id="menu-speed-value"></span></button>
        <button class="btn" type="button" id="menu-lang"><span data-i18n="menu.language"></span><span class="menu-value" id="menu-lang-value"></span></button>
        <a class="btn" href="./index.html" data-transition data-i18n="menu.quit"></a>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="t24" id="loading-era">OneDay</div>
    <div class="loading-bar"><span id="loading-fill"></span></div>
    <div class="t8 soft" data-i18n="game.loading"></div>
  </div>

  <script type="module">
    import { getCurrentUser } from './shared/auth.js';
    import { loadEra, getEraMeta } from './shared/era-registry.js';
    import { createResourceState, applyResourceDeltas, isCriticalDepleted, getCriticalResourceKey } from './shared/resources.js';
    import { createDayState, getCurrentSlot, formatClock, advanceTime, isTimeUp, trackMinSeen, dayFraction } from './shared/day-engine.js';
    import { getValidCards, pickWeightedCard, computeSuccessChance, resolveOption } from './shared/decision-engine.js';
    import { pickDailyObjectives, isObjectiveComplete } from './shared/objectives.js';
    import { recordDayGains, checkAndUnlockMetaAchievements } from './shared/achievements.js';
    import { recordDayResult } from './shared/stats.js';
    import { createRng, randomSeed, dailySeed } from './shared/rng.js';
    import { t, localize, loadStrings, getLanguage, setLanguage, onLanguageChange } from './shared/i18n.js';
    import { getLocalDailyResult, saveLocalDailyResult, checkRemoteDailyEntry, submitDailyScore, getDailyLeaderboard, todayDateKey, hasPlayedToday } from './shared/daily-challenge.js';
    import { computeDayScore } from './shared/scoring.js';
    import { isBarResource, resourceFraction, resourceBarLevel } from './shared/resource-bar.js';
    import { applyCounterDeltas } from './shared/narrative.js';
    import { resolvePersona, rankTraits } from './shared/persona.js';
    import { selectMemorySeed, extractMemorableState } from './shared/memories-logic.js';
    import { getEraMemories, recordEraMemories } from './shared/memories.js';
    import { findNpc } from './shared/npc.js';
    import { getStreak, recordStreakForToday } from './shared/streaks.js';
    import { renderShareCardCanvas, downloadCanvasAsPng } from './shared/share-card.js';
    import { placeForCard } from './shared/stage/places.js';
    import { actionForOption, reactionForOutcome, deltaPopups, skyAt } from './shared/stage/direction.js';
    import { buildFrame, playerPalette, npcPalette } from './shared/stage/sprites.js';
    import { sfx } from './shared/stage/sfx.js';
    import { music } from './shared/stage/music.js';
    import { icon, resourceIcon } from './shared/ui/icons.js';
    import { getSettings, updateSettings, typingDelay } from './shared/ui/settings.js';
    import { wipeIn, wipeOut, setLoading, finishLoading } from './shared/ui/screens.js';

    const FILLER_CARD = {
      id: 'filler-wait',
      text: { en: 'Nothing much happens for a moment. The world moves around you.', es: 'No pasa gran cosa por un momento. El mundo sigue su curso a tu alrededor.' },
      options: [
        { id: 'rest', text: { en: 'Take a moment', es: 'Tómate un momento' }, traits: { prudent: 1 }, cost: { time: 1 }, successChance: { base: 1 }, success: { resources: { energy: 5 }, text: { en: 'You catch your breath.', es: 'Recuperas el aliento.' } } },
      ],
    };
    const SPEEDS = ['slow', 'normal', 'fast'];

    const params = new URLSearchParams(window.location.search);
    const eraId = params.get('era');
    const eraMeta = getEraMeta(eraId);
    if (!eraMeta) window.location.href = './index.html';
    document.body.dataset.era = eraId;

    const $ = selector => document.querySelector(selector);
    const hud = $('#hud');
    const decisionScreen = $('#decision-screen');
    const outcomeScreen = $('#outcome-screen');
    const summaryScreen = $('#summary-screen');
    const cardText = $('#card-text');
    const optionsEl = $('#options');
    const pause = $('#pause');

    $('#back-icon').innerHTML = icon('back', 3);
    $('#menu-icon').innerHTML = icon('menu', 3);
    $('#next-icon').innerHTML = icon('next', 3);

    let era = null;
    let cards = [];
    let rng = null;
    let resourceState = null;
    let previousResourceState = null;
    let dayState = null;
    let dailyObjectives = [];
    let narrativeLog = [];
    let gainsThisDay = {};
    let currentCard = null;
    let currentOutcome = null;
    let summaryData = null;
    let phase = 'loading';
    let busy = false;
    let armed = 0;
    let isDaily = false;
    let dailyDateKeyValue = null;
    let lastLeaderboardEntries = null;

    // --- The 3D stage. If WebGL or the module is unavailable the game is still
    // fully playable: every stage call becomes a no-op and the HUD carries it.
    const noStage = { goTo: async () => {}, act: async () => {}, react: async () => {}, setDayFraction() {}, setCritical() {}, finale() {}, reset() {} };
    let stage = noStage;

    const withTimeout = (promise, ms) => Promise.race([promise, new Promise(resolve => setTimeout(resolve, ms))]);
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function mergeDeltas(a = {}, b = {}) {
      const result = { ...a };
      Object.entries(b).forEach(([key, value]) => { result[key] = (result[key] || 0) + value; });
      return result;
    }

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      $('#daily-badge').hidden = !isDaily;
      $('#era-title').textContent = localize(era.name);
      $('#back-link').setAttribute('aria-label', t('nav.eras'));
      $('#menu-open').setAttribute('aria-label', t('menu.title'));
      document.title = `OneDay — ${localize(era.name)}`;
      renderMenuValues();
    }

    function renderMenuValues() {
      const settings = getSettings();
      $('#menu-music-value').textContent = settings.music ? t('menu.on') : t('menu.off');
      $('#menu-sound-value').textContent = settings.sfx ? t('menu.on') : t('menu.off');
      $('#menu-speed-value').textContent = t(`speed.${settings.textSpeed}`);
      $('#menu-lang-value').textContent = getLanguage() === 'en' ? 'English' : 'Español';
    }

    // --- Pixel portraits for the dialog box ---
    function drawPortrait(palette) {
      const canvas = $('#portrait');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      buildFrame('stand').slice(0, 14).forEach((row, y) => {
        [...row].forEach((ch, x) => {
          if (ch === '.' || !palette[ch]) return;
          ctx.fillStyle = palette[ch];
          ctx.fillRect(x, y, 1, 1);
        });
      });
    }

    // --- Typewriter ---
    let skipTyping = null;
    function typeInto(el, text) {
      el.textContent = '';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = text;
        return Promise.resolve();
      }
      return new Promise(resolve => {
        let i = 0;
        const node = document.createTextNode('');
        const caret = document.createElement('span');
        caret.className = 'caret';
        el.append(node, caret);
        const finish = () => {
          clearInterval(id);
          node.textContent = text;
          caret.remove();
          skipTyping = null;
          resolve();
        };
        skipTyping = finish;
        const id = setInterval(() => {
          i += 1;
          node.textContent = text.slice(0, i);
          if (i % 3 === 0 && text[i] !== ' ') sfx.type();
          if (i >= text.length) finish();
        }, typingDelay());
      });
    }

    function showBanner(html, className) {
      const host = $('#banner-host');
      const banner = document.createElement('div');
      banner.className = className;
      banner.innerHTML = html;
      host.replaceChildren(banner);
    }

    function resetDay() {
      rng = createRng(isDaily ? dailySeed(eraId, new Date()) : randomSeed());
      resourceState = createResourceState(era);
      previousResourceState = null;
      dayState = createDayState(era, selectMemorySeed(getCurrentUser(), getEraMemories(eraId)));
      dailyObjectives = pickDailyObjectives(era, 3, rng);
      narrativeLog = [];
      gainsThisDay = {};
      summaryData = null;
    }

    function renderClock() {
      const slot = getCurrentSlot(era, dayState.elapsed);
      $('#clock-time').textContent = formatClock(era, dayState.elapsed);
      $('#slot-label').textContent = `${localize(slot.label)} · ${t('game.until')} ${era.day.endLabel}`;
      const pct = Math.round(dayFraction(dayState) * 100);
      $('#day-fill').style.width = `${pct}%`;
      $('#day-sun').style.left = `${pct}%`;
      music.setNight(skyAt(eraId, dayFraction(dayState)).night);
    }

    function renderHUD() {
      renderClock();
      let anyCritical = false;
      const resourcesHtml = Object.entries(era.resources).map(([key, config]) => {
        const value = resourceState[key];
        const changed = previousResourceState !== null && previousResourceState[key] !== value;
        const head = `${resourceIcon(key, 2)}<span class="res-name">${localize(config.label)}</span><span class="res-value">${value}</span>`;
        if (!isBarResource(config)) return `<div class="res plain${changed ? ' tick' : ''}">${head}</div>`;
        const fraction = resourceFraction(value, config);
        const level = resourceBarLevel(fraction);
        if (config.critical && level === 'critical') anyCritical = true;
        return `<div class="res ${level}${changed ? ' tick' : ''}">${head}<div class="res-track"><div class="res-fill" style="width:${Math.round(fraction * 100)}%"></div></div></div>`;
      }).join('');

      // Which trait today's choices are adding up to, live: that decides the ending.
      const leading = rankTraits(dayState.traits)[0];
      const leaningHtml = `<div class="leaning">
        <span class="res-name">${t('game.leaning')}</span>
        <span class="leaning-value">${leading ? t(`trait.${leading.trait}`) : t('game.leaningNone')}</span>
      </div>`;

      hud.innerHTML = resourcesHtml + leaningHtml;
      document.body.classList.toggle('critical-alert', anyCritical);
      stage.setCritical(anyCritical);
      previousResourceState = { ...resourceState };
    }

    function formatCost(option) {
      const parts = [`<span class="cost-item time">${option.cost?.time || 0}H</span>`];
      Object.entries(option.cost?.resources || {}).forEach(([key, delta]) => {
        if (!delta) return;
        parts.push(`<span class="cost-item ${delta > 0 ? 'pos' : 'neg'}">${resourceIcon(key, 1)}${delta > 0 ? '+' : ''}${delta} ${localize(era.resources[key].label)}</span>`);
      });
      return `<span class="cost">${parts.join('')}</span>`;
    }

    function oddsHtml(option) {
      if (!option.successChance) return '';
      const chance = computeSuccessChance(option.successChance, { resourceState, era, traits: dayState.traits });
      if (chance >= 1) return '';
      const pct = Math.round(chance * 100);
      return `<span class="odds"><span class="odds-bar"><span style="width:${pct}%"></span></span>${pct}%</span>`;
    }

    function pickNextCard() {
      const valid = getValidCards(cards, era, resourceState, dayState);
      currentCard = valid.length ? pickWeightedCard(valid, rng) : FILLER_CARD;
    }

    function hideAll() {
      decisionScreen.hidden = true;
      outcomeScreen.hidden = true;
      summaryScreen.hidden = true;
    }

    function renderDecisionHead() {
      const npc = currentCard.npcId ? findNpc(era, currentCard.npcId) : null;
      const place = placeForCard(eraId, currentCard);
      $('#speaker').textContent = npc ? localize(npc.name) : localize(place.label);
      $('#speaker-role').textContent = npc ? `${localize(npc.role)} · ${localize(place.label)}` : '';
      $('#card-meta').textContent = `${Math.round(dayFraction(dayState) * 100)}% ${t('game.dayElapsed')}`;
      drawPortrait(npc ? npcPalette(npc.portraitColor, eraId) : playerPalette(eraId));
    }

    function armChoice(index, withSound = true) {
      const buttons = [...optionsEl.querySelectorAll('.choice')];
      if (!buttons.length) return;
      armed = (index + buttons.length) % buttons.length;
      buttons.forEach((button, i) => {
        button.classList.toggle('armed', i === armed);
        button.setAttribute('aria-selected', String(i === armed));
      });
      if (withSound) sfx.move();
    }

    function renderOptions() {
      optionsEl.innerHTML = '';
      currentCard.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.setAttribute('role', 'option');
        button.innerHTML = `
          <span class="choice-cursor">${icon('cursor', 3)}</span>
          <span class="kbd choice-key">${index + 1}</span>
          <span class="choice-text">${localize(option.text)}</span>
          <span class="choice-foot">${formatCost(option)}${oddsHtml(option)}</span>
        `;
        button.addEventListener('click', () => chooseOption(option));
        button.addEventListener('mouseenter', () => { if (armed !== index) armChoice(index); });
        optionsEl.appendChild(button);
      });
      armChoice(0, false);
    }

    // Re-render the decision without replaying the walk or the typing
    // (used when the language changes mid-card).
    function renderDecisionUI() {
      hideAll();
      decisionScreen.hidden = false;
      renderHUD();
      renderDecisionHead();
      cardText.textContent = localize(currentCard.text);
      renderOptions();
      optionsEl.classList.remove('revealing');
    }

    async function showDecision() {
      phase = 'walking';
      busy = true;
      pickNextCard();
      hideAll();
      renderHUD();
      const place = placeForCard(eraId, currentCard);
      const npc = currentCard.npcId ? findNpc(era, currentCard.npcId) : null;
      showBanner(`<span class="t16">${localize(place.label)}</span>`, 'place-banner frame-sm');
      await withTimeout(stage.goTo(place, npc ? { color: npc.portraitColor, name: localize(npc.name) } : null), 6000);

      phase = 'decision';
      decisionScreen.hidden = false;
      renderDecisionHead();
      renderOptions();
      optionsEl.classList.add('revealing');
      await typeInto(cardText, localize(currentCard.text));
      optionsEl.classList.remove('revealing');
      busy = false;
    }

    async function chooseOption(option) {
      if (busy || phase !== 'decision' || !pause.hidden) return;
      busy = true;
      sfx.select();
      optionsEl.querySelectorAll('.choice').forEach(button => { button.disabled = true; });
      const slotBefore = getCurrentSlot(era, dayState.elapsed).id;

      const { success, chance, outcome } = resolveOption(option, { resourceState, era, traits: dayState.traits }, rng);
      const combined = mergeDeltas(option.cost?.resources, outcome.resources);
      resourceState = applyResourceDeltas(resourceState, era, combined);
      dayState = advanceTime(dayState, option.cost?.time || 0);
      dayState = trackMinSeen(dayState, resourceState);
      // Traits accumulate exactly like NPC counters do -- same named-number
      // bag, same helper; only what they mean at day's end differs.
      dayState = { ...dayState, traits: applyCounterDeltas(dayState.traits, option.traits) };
      if (outcome.flagsSet?.length) dayState = { ...dayState, flags: [...dayState.flags, ...outcome.flagsSet] };
      if (outcome.countersAdd) dayState = { ...dayState, counters: applyCounterDeltas(dayState.counters, outcome.countersAdd) };
      dayState = { ...dayState, playedCardIds: [...dayState.playedCardIds, currentCard.id] };
      gainsThisDay = mergeDeltas(gainsThisDay, combined);
      if (outcome.text) narrativeLog.push(outcome.text);

      // A sure thing is not a gamble: it gets no SUCCESS/FAILURE tag and no big reaction.
      currentOutcome = { hasChance: !!option.successChance && chance < 1, success, text: outcome.text, combined };

      // The stage acts it out before the words arrive.
      phase = 'acting';
      decisionScreen.hidden = true;
      await withTimeout(stage.act(actionForOption(option)), 4000);
      stage.setDayFraction(dayFraction(dayState));
      const reaction = reactionForOutcome(currentOutcome);
      if (reaction === 'cheer') sfx.good(); else if (reaction === 'stumble') sfx.bad(); else sfx.neutral();
      await withTimeout(stage.react(reaction, deltaPopups(combined, era.resources, localize)), 4000);

      // A new part of the day gets its own title card.
      const slotAfter = getCurrentSlot(era, dayState.elapsed);
      if (slotAfter.id !== slotBefore && !isTimeUp(dayState)) {
        sfx.chime();
        showBanner(`${localize(slotAfter.label)}<small>${formatClock(era, dayState.elapsed)}</small>`, 'slot-banner');
      }

      phase = 'outcome';
      renderHUD();
      renderOutcomeUI();
      busy = false;
      $('#outcome-continue').focus({ preventScroll: true });
    }

    function renderOutcomeUI() {
      hideAll();
      outcomeScreen.hidden = false;
      const tag = $('#outcome-tag');
      tag.textContent = currentOutcome.hasChance ? (currentOutcome.success ? t('outcome.success') : t('outcome.failure')) : '';
      tag.className = `outcome-tag ${currentOutcome.hasChance ? (currentOutcome.success ? 'ok' : 'bad') : ''}`;
      $('#outcome-text').textContent = currentOutcome.text ? localize(currentOutcome.text) : '';
      $('#outcome-deltas').innerHTML = Object.entries(currentOutcome.combined)
        .filter(([, value]) => value !== 0)
        .map(([key, value]) => `<span class="delta ${value > 0 ? 'up' : 'down'}">${resourceIcon(key, 1)}${value > 0 ? '+' : ''}${value} ${localize(era.resources[key].label)}</span>`)
        .join('');
    }

    function continueDay() {
      if (busy || phase !== 'outcome' || !pause.hidden) return;
      sfx.move();
      if (isTimeUp(dayState) || isCriticalDepleted(resourceState, era)) endDay();
      else showDecision();
    }

    $('#outcome-continue').addEventListener('click', continueDay);

    // The end of the day is a short cinematic: letterbox, then the name the day
    // gave you, then the results panel.
    let skipReveal = null;
    async function playReveal(persona, good) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      phase = 'reveal';
      document.body.classList.add('letterbox');
      const reveal = $('#reveal');
      $('#reveal-kicker').textContent = t('game.summaryKicker');
      $('#reveal-name').textContent = persona ? localize(persona.name) : t('game.summaryHeading');
      reveal.hidden = false;
      sfx.end(good);
      await new Promise(resolve => {
        const timer = setTimeout(resolve, 3200);
        skipReveal = () => { clearTimeout(timer); resolve(); };
      });
      skipReveal = null;
      reveal.hidden = true;
      document.body.classList.remove('letterbox');
    }

    async function endDay() {
      const objectivesResults = dailyObjectives.map(objective => ({
        objective,
        complete: isObjectiveComplete(objective, { resourceState, dayState }),
      }));
      const completedCount = objectivesResults.filter(entry => entry.complete).length;
      recordDayResult(eraId, { objectivesCompleted: completedCount });
      recordDayGains(eraId, gainsThisDay);
      if (getCurrentUser()) recordEraMemories(eraId, extractMemorableState(era, dayState));
      if (isDaily && getCurrentUser()) recordStreakForToday(dailyDateKeyValue);
      const newlyUnlocked = checkAndUnlockMetaAchievements(eraId, era);
      const criticalKey = getCriticalResourceKey(resourceState, era);
      const persona = resolvePersona(era, dayState.traits);

      let score = null;
      if (isDaily) {
        score = computeDayScore({ objectivesCompletedCount: completedCount, resourceState, era });
        saveLocalDailyResult(eraId, {
          date: dailyDateKeyValue,
          eraId,
          objectivesResults: objectivesResults.map(entry => ({ id: entry.objective.id, complete: entry.complete })),
          finalResources: { ...resourceState },
          criticalKey: criticalKey || null,
          personaId: persona?.id || null,
          log: [...narrativeLog],
          score: score.total,
          objectivesScore: score.objectivesScore,
          tiebreakScore: score.tiebreakScore,
        });
      }

      summaryData = { objectivesResults, newlyUnlocked, criticalKey, persona, finalResources: { ...resourceState }, log: [...narrativeLog], score, streak: getStreak(), alreadyPlayed: false };
      hideAll();
      stage.finale(!criticalKey);
      await playReveal(persona, !criticalKey);
      phase = 'summary';
      renderSummaryUI();

      if (isDaily) {
        (async () => {
          if (getCurrentUser()) {
            await submitDailyScore(eraId, dailyDateKeyValue, {
              score: score.total,
              objectivesScore: score.objectivesScore,
              tiebreakScore: score.tiebreakScore,
              objectivesResults: objectivesResults.map(entry => ({ id: entry.objective.id, complete: entry.complete })),
              finalResources: { ...resourceState },
              criticalKey: criticalKey || null,
            });
          }
          await refreshLeaderboard();
        })();
      }
    }

    function showAlreadyPlayed(saved) {
      const objectivesResults = (saved.objectivesResults || []).map(entry => {
        const objective = (era.objectivesPool || []).find(o => o.id === entry.id) || { description: { en: entry.id, es: entry.id } };
        return { objective, complete: entry.complete };
      });
      summaryData = {
        objectivesResults,
        newlyUnlocked: [],
        criticalKey: saved.criticalKey || null,
        persona: (era.personas || []).find(p => p.id === saved.personaId) || null,
        finalResources: saved.finalResources || {},
        log: saved.log || null,
        score: { objectivesScore: saved.objectivesScore, tiebreakScore: saved.tiebreakScore, total: saved.score },
        streak: getStreak(),
        alreadyPlayed: true,
      };
      phase = 'summary';
      stage.finale(!saved.criticalKey);
      renderSummaryUI();
      refreshLeaderboard();
    }

    function renderSummaryUI() {
      hideAll();
      summaryScreen.hidden = false;
      document.body.classList.remove('critical-alert');
      stage.setCritical(false);

      const persona = summaryData.persona;
      $('#verdict-kicker').textContent = summaryData.alreadyPlayed ? t('daily.alreadyPlayedHeading') : t('game.summaryKicker');
      $('#persona-name').textContent = persona ? localize(persona.name) : t('game.summaryHeading');
      $('#persona-desc').textContent = persona ? localize(persona.description) : '';

      const endingEl = $('#ending-line');
      endingEl.textContent = summaryData.criticalKey ? localize(era.badEnding) : localize(era.goodEnding);
      endingEl.className = `ending-line ${summaryData.criticalKey ? 'bad' : ''}`;

      $('#summary-objectives').innerHTML = summaryData.objectivesResults.map((entry, index) => `
        <li class="${entry.complete ? 'done' : ''}" style="animation-delay:${index * 0.08}s"><span class="mark">${entry.complete ? '✓' : '✗'}</span> ${localize(entry.objective.description)}</li>
      `).join('');

      $('#summary-resources').innerHTML = Object.entries(era.resources).map(([key, config], index) => `
        <li style="animation-delay:${index * 0.05}s">${resourceIcon(key, 2)}${localize(config.label)}<span class="val">${summaryData.finalResources[key] ?? '–'}</span></li>
      `).join('');

      $('#summary-achievements').innerHTML = (summaryData.newlyUnlocked || []).map((achievement, index) => `
        <div class="unlock" style="animation-delay:${0.3 + index * 0.12}s"><strong class="t16">${localize(achievement.title)}</strong><br><span class="muted">${localize(achievement.description)}</span></div>
      `).join('');

      $('#summary-log').innerHTML = summaryData.log
        ? (summaryData.log.map(line => `<p>${localize(line)}</p>`).join('') || `<p>${t('game.recapEmpty')}</p>`)
        : `<p>${t('daily.recapUnavailable')}</p>`;

      const scoreSection = $('#summary-score');
      if (summaryData.score) {
        scoreSection.hidden = false;
        scoreSection.innerHTML = `
          <div class="score"><div class="score-value">${summaryData.score.objectivesScore}</div><div class="t8 muted">${t('daily.scoreObjectives')}</div></div>
          <div class="score"><div class="score-value">${summaryData.score.tiebreakScore}</div><div class="t8 muted">${t('daily.scoreTiebreak')}</div></div>
          <div class="score total"><div class="score-value">${summaryData.score.total}</div><div class="t8 muted">${t('daily.scoreTotal')}</div></div>
        `;
      } else {
        scoreSection.hidden = true;
        scoreSection.innerHTML = '';
      }

      const streakEl = $('#summary-streak');
      const hasStreak = isDaily && summaryData.streak && summaryData.streak.currentStreak > 1;
      streakEl.hidden = !hasStreak;
      if (hasStreak) streakEl.textContent = t('daily.streakLabel', { count: summaryData.streak.currentStreak });

      $('#play-again').hidden = isDaily;
      $('#summary-comeback').hidden = !isDaily;
      $('#summary-leaderboard-section').hidden = !isDaily;
      $('#download-card').hidden = !isDaily || !summaryData.score;
    }

    function renderLeaderboardHtml() {
      const list = $('#summary-leaderboard');
      if (lastLeaderboardEntries === null) {
        list.innerHTML = `<li>${t('daily.leaderboardLoading')}</li>`;
        return;
      }
      const currentUsername = getCurrentUser()?.displayName;
      let html = lastLeaderboardEntries.length === 0
        ? `<li>${t('daily.leaderboardEmpty')}</li>`
        : lastLeaderboardEntries.map((entry, index) => `
            <li class="${entry.username === currentUsername ? 'you' : ''}">
              <span class="rank">${String(index + 1).padStart(2, '0')}</span>${entry.username}<span class="val">${entry.score}</span>
            </li>
          `).join('');
      if (!getCurrentUser()) html += `<li class="muted">${t('daily.leaderboardLoginToAppear')}</li>`;
      list.innerHTML = html;
    }

    async function refreshLeaderboard() {
      lastLeaderboardEntries = null;
      renderLeaderboardHtml();
      try {
        lastLeaderboardEntries = await getDailyLeaderboard(eraId, dailyDateKeyValue, 10);
      } catch (error) {
        console.warn('OneDay: could not load daily leaderboard', error);
        lastLeaderboardEntries = [];
      }
      renderLeaderboardHtml();
    }

    $('#play-again').addEventListener('click', () => {
      sfx.select();
      resetDay();
      stage.reset();
      showDecision();
    });

    $('#download-card').addEventListener('click', async () => {
      const canvas = $('#share-canvas');
      await renderShareCardCanvas(canvas, {
        eraName: localize(era.name),
        accentHue: eraMeta.accent,
        personaName: summaryData.persona ? localize(summaryData.persona.name) : '',
        endingText: summaryData.criticalKey ? localize(era.badEnding) : localize(era.goodEnding),
        dateLabel: dailyDateKeyValue,
        score: summaryData.score,
        objectives: summaryData.objectivesResults.map(entry => ({ description: localize(entry.objective.description), complete: entry.complete })),
        streak: summaryData.streak,
        appLabel: 'OneDay',
      });
      downloadCanvasAsPng(canvas, `oneday-${eraId}-${dailyDateKeyValue}.png`);
    });

    // --- Pause menu ---
    function openPause() {
      if (phase === 'loading') return;
      skipTyping?.();
      pause.hidden = false;
      sfx.select();
      $('#menu-resume').focus();
    }
    function closePause() {
      pause.hidden = true;
      sfx.back();
    }
    $('#menu-open').addEventListener('click', openPause);
    $('#menu-resume').addEventListener('click', closePause);
    pause.addEventListener('click', event => { if (event.target === pause) closePause(); });
    $('#menu-music').addEventListener('click', () => { updateSettings({ music: !getSettings().music }); renderMenuValues(); sfx.move(); });
    $('#menu-sound').addEventListener('click', () => { updateSettings({ sfx: !getSettings().sfx }); renderMenuValues(); sfx.move(); });
    $('#menu-speed').addEventListener('click', () => {
      const next = SPEEDS[(SPEEDS.indexOf(getSettings().textSpeed) + 1) % SPEEDS.length];
      updateSettings({ textSpeed: next });
      renderMenuValues();
      sfx.move();
    });
    $('#menu-lang').addEventListener('click', () => { setLanguage(getLanguage() === 'en' ? 'es' : 'en'); sfx.move(); });

    // Leaving the page plays the pixel wipe first.
    document.querySelectorAll('[data-transition], #back-link').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        sfx.back();
        wipeIn().then(() => { window.location.href = link.href; });
      });
    });

    // Keyboard: arrows (or 1-4) choose, Enter/Space confirms or skips the typing, Esc pauses.
    document.addEventListener('keydown', event => {
      if (event.target.closest('input, textarea')) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        if (pause.hidden) openPause(); else closePause();
        return;
      }
      if (!pause.hidden) return;
      const confirm = event.key === 'Enter' || event.key === ' ';
      if (phase === 'reveal' && (confirm || event.key === 'Escape')) { event.preventDefault(); skipReveal?.(); return; }
      if (phase === 'decision') {
        if (skipTyping && confirm) { event.preventDefault(); skipTyping(); return; }
        if (skipTyping) return;
        const index = ['1', '2', '3', '4'].indexOf(event.key);
        if (index >= 0 && currentCard.options[index]) { event.preventDefault(); chooseOption(currentCard.options[index]); return; }
        const columns = 1;
        if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { event.preventDefault(); armChoice(armed + columns); }
        else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { event.preventDefault(); armChoice(armed - columns); }
        else if (confirm && event.target.closest('.choice') === null) { event.preventDefault(); chooseOption(currentCard.options[armed]); }
      } else if (phase === 'outcome' && confirm && event.target.id !== 'outcome-continue') {
        event.preventDefault();
        continueDay();
      }
    });
    cardText.addEventListener('click', () => skipTyping?.());
    $('#reveal').addEventListener('click', () => skipReveal?.());
    document.addEventListener('click', event => { if (phase === 'reveal' && !event.target.closest('button')) skipReveal?.(); });

    onLanguageChange(() => {
      applyStaticI18n();
      if (phase === 'decision') { skipTyping?.(); renderDecisionUI(); }
      else if (phase === 'outcome') { renderHUD(); renderOutcomeUI(); }
      else if (phase === 'summary') { renderSummaryUI(); if (isDaily) renderLeaderboardHtml(); }
      else if (dayState) renderHUD();
    });

    (async function init() {
      $('#loading-era').textContent = eraMeta ? localize(eraMeta.name) : 'OneDay';
      setLoading(0.15);
      await loadStrings();
      applyStaticFallback();
      setLoading(0.35);
      const loaded = await loadEra(eraId);
      era = loaded.era;
      cards = loaded.cards;
      isDaily = params.get('daily') === '1';
      dailyDateKeyValue = todayDateKey();
      applyStaticI18n();
      setLoading(0.6);

      try {
        const { createStage } = await import('./shared/stage/stage.js');
        setLoading(0.8);
        stage = await createStage($('#stage'), { eraId, mode: 'play', onStep: () => sfx.step() });
      } catch (error) {
        console.warn('OneDay: 3D stage unavailable, playing without it', error);
        document.body.classList.add('no-stage');
      }
      setLoading(1);
      await wait(250);
      finishLoading();
      wipeOut();
      music.play(eraId);

      if (isDaily) {
        const local = getLocalDailyResult(eraId);
        if (hasPlayedToday(local, dailyDateKeyValue)) { showAlreadyPlayed(local); return; }
        if (getCurrentUser()) {
          try {
            const remote = await checkRemoteDailyEntry(eraId, dailyDateKeyValue);
            if (remote) { showAlreadyPlayed(remote); return; }
          } catch (error) { console.warn('OneDay: could not check remote daily entry', error); }
        }
      }

      resetDay();
      showDecision();
    })();

    // The loading screen's caption is localised as soon as the strings arrive.
    function applyStaticFallback() {
      document.querySelectorAll('.loading [data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    }
  </script>
</body>
</html>
