<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OneDay: live one decisive day, one decision at a time.">
  <meta name="theme-color" content="#14111c">
  <title>OneDay — Playing</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="./shared/game.css">
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="vignette"></div>

  <header class="topbar">
    <div class="chip-row">
      <a class="chip panel" href="./index.html">◂ <span data-i18n="nav.eras"></span></a>
      <div class="era-title panel">
        <h1 id="era-title"></h1>
        <span class="badge" id="daily-badge" hidden data-i18n="daily.badge"></span>
      </div>
    </div>

    <div class="clock panel" aria-live="polite">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-slot label" id="slot-label"></div>
      <div class="day-track" aria-hidden="true">
        <div class="day-fill" id="day-fill" style="width:0%"></div>
        <div class="day-sun" id="day-sun" style="left:0%"></div>
      </div>
    </div>

    <div class="chip-row">
      <button class="chip panel" type="button" id="sound-toggle" aria-pressed="true"></button>
      <span class="chip panel lang-switch">
        <button type="button" id="lang-en">EN</button>
        <button type="button" id="lang-es">ES</button>
      </span>
    </div>
  </header>

  <aside class="hud panel" id="hud" aria-label="Status"></aside>

  <div id="place-banner-host" aria-live="polite"></div>

  <main>
    <section id="decision-screen" class="dialog panel" hidden aria-live="polite">
      <div class="dialog-head">
        <canvas class="portrait" id="portrait" width="16" height="14" aria-hidden="true"></canvas>
        <div>
          <div class="speaker" id="speaker"></div>
          <span class="label" id="card-meta"></span>
        </div>
      </div>
      <p class="dialog-text" id="card-text"></p>
      <div class="choices revealing" id="options"></div>
      <div class="hint" data-i18n="game.keysHint"></div>
    </section>

    <section id="outcome-screen" class="dialog panel" hidden aria-live="polite">
      <span class="outcome-tag" id="outcome-tag"></span>
      <p class="dialog-text" id="outcome-text"></p>
      <div class="deltas" id="outcome-deltas"></div>
      <div class="dialog-actions">
        <button id="outcome-continue" class="btn btn-primary" type="button"><span data-i18n="game.continue"></span> <span class="kbd">↵</span></button>
      </div>
    </section>

    <section id="summary-screen" class="results panel" hidden>
      <div class="verdict">
        <span class="label" id="verdict-kicker"></span>
        <h2 id="persona-name"></h2>
        <p class="verdict-desc" id="persona-desc"></p>
        <p class="ending-line" id="ending-line"></p>
        <p class="streak-line" id="summary-streak" hidden></p>
      </div>

      <div class="score-row" id="summary-score" hidden></div>

      <div class="summary-cols">
        <div>
          <div class="col-head" data-i18n="game.objectivesHeading"></div>
          <ul class="line-list" id="summary-objectives"></ul>
          <div id="summary-achievements"></div>
        </div>
        <div>
          <div class="col-head" data-i18n="game.resourcesHeading"></div>
          <ul class="line-list" id="summary-resources"></ul>
        </div>
        <div>
          <div class="col-head" data-i18n="game.recapHeading"></div>
          <div class="recap" id="summary-log"></div>
        </div>
        <div id="summary-leaderboard-section" hidden>
          <div class="col-head" data-i18n="daily.leaderboardHeading"></div>
          <ul class="line-list leaderboard" id="summary-leaderboard"></ul>
        </div>
      </div>

      <p id="summary-comeback" class="muted small" hidden data-i18n="daily.comeBackTomorrow"></p>
      <div class="actions-row">
        <button id="play-again" class="btn btn-primary" type="button" data-i18n="game.playAgain"></button>
        <button id="download-card" class="btn" type="button" hidden data-i18n="game.downloadCard"></button>
        <a class="btn btn-quiet" href="./index.html" data-i18n="game.changeEra"></a>
      </div>
      <canvas id="share-canvas" hidden></canvas>
    </section>
  </main>

  <script type="module">
    import { getCurrentUser } from './shared/auth.js';
    import { loadEra, getEraMeta } from './shared/era-registry.js';
    import { createResourceState, applyResourceDeltas, isCriticalDepleted, getCriticalResourceKey } from './shared/resources.js';
    import { createDayState, getCurrentSlot, formatClock, advanceTime, isTimeUp, trackMinSeen, dayFraction } from './shared/day-engine.js';
    import { getValidCards, pickWeightedCard, computeSuccessChance, resolveOption } from './shared/decision-engine.js';
    import { pickDailyObjectives, isObjectiveComplete } from './shared/objectives.js';
    import { recordDayGains, checkAndUnlockMetaAchievements } from './shared/achievements.js';
    import { recordDayResult } from './shared/stats.js';
    import { createRng, randomSeed, dailySeed } from './shared/rng.js';
    import { t, localize, loadStrings, getLanguage, setLanguage, onLanguageChange } from './shared/i18n.js';
    import { getLocalDailyResult, saveLocalDailyResult, checkRemoteDailyEntry, submitDailyScore, getDailyLeaderboard, todayDateKey, hasPlayedToday } from './shared/daily-challenge.js';
    import { computeDayScore } from './shared/scoring.js';
    import { isBarResource, resourceFraction, resourceBarLevel } from './shared/resource-bar.js';
    import { applyCounterDeltas } from './shared/narrative.js';
    import { resolvePersona, rankTraits } from './shared/persona.js';
    import { selectMemorySeed, extractMemorableState } from './shared/memories-logic.js';
    import { getEraMemories, recordEraMemories } from './shared/memories.js';
    import { findNpc } from './shared/npc.js';
    import { getStreak, recordStreakForToday } from './shared/streaks.js';
    import { renderShareCardCanvas, downloadCanvasAsPng } from './shared/share-card.js';
    import { placeForCard } from './shared/stage/places.js';
    import { actionForOption, reactionForOutcome, deltaPopups } from './shared/stage/direction.js';
    import { buildFrame, playerPalette, npcPalette } from './shared/stage/sprites.js';
    import { sfx, isMuted, setMuted } from './shared/stage/sfx.js';

    const FILLER_CARD = {
      id: 'filler-wait',
      text: { en: 'Nothing much happens for a moment. The world moves around you.', es: 'No pasa gran cosa por un momento. El mundo sigue su curso a tu alrededor.' },
      options: [
        { id: 'rest', text: { en: 'Take a moment', es: 'Tómate un momento' }, traits: { prudent: 1 }, cost: { time: 1 }, successChance: { base: 1 }, success: { resources: { energy: 5 }, text: { en: 'You catch your breath.', es: 'Recuperas el aliento.' } } },
      ],
    };

    const params = new URLSearchParams(window.location.search);
    const eraId = params.get('era');
    const eraMeta = getEraMeta(eraId);
    if (!eraMeta) window.location.href = './index.html';
    document.body.dataset.era = eraId;

    const eraTitle = document.querySelector('#era-title');
    const slotLabel = document.querySelector('#slot-label');
    const hud = document.querySelector('#hud');
    const decisionScreen = document.querySelector('#decision-screen');
    const outcomeScreen = document.querySelector('#outcome-screen');
    const summaryScreen = document.querySelector('#summary-screen');
    const cardText = document.querySelector('#card-text');
    const optionsEl = document.querySelector('#options');

    let era = null;
    let cards = [];
    let rng = null;
    let resourceState = null;
    let previousResourceState = null;
    let dayState = null;
    let dailyObjectives = [];
    let narrativeLog = [];
    let gainsThisDay = {};
    let currentCard = null;
    let currentOutcome = null;
    let summaryData = null;
    let phase = 'loading';
    let busy = false;
    let isDaily = false;
    let dailyDateKeyValue = null;
    let lastLeaderboardEntries = null;

    // --- The 3D stage. If WebGL or the module is unavailable the game is still
    // fully playable: every stage call becomes a no-op and the HUD carries it.
    const noStage = { goTo: async () => {}, act: async () => {}, react: async () => {}, setDayFraction() {}, setCritical() {}, finale() {}, reset() {} };
    let stage = noStage;

    function withTimeout(promise, ms) {
      return Promise.race([promise, new Promise(resolve => setTimeout(resolve, ms))]);
    }

    function mergeDeltas(a = {}, b = {}) {
      const result = { ...a };
      Object.entries(b).forEach(([key, value]) => { result[key] = (result[key] || 0) + value; });
      return result;
    }

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelector('#lang-en').className = getLanguage() === 'en' ? 'active' : '';
      document.querySelector('#lang-es').className = getLanguage() === 'es' ? 'active' : '';
      document.querySelector('#daily-badge').hidden = !isDaily;
      eraTitle.textContent = localize(era.name);
      document.title = `OneDay — ${localize(era.name)}`;
      renderSoundToggle();
    }

    function renderSoundToggle() {
      const button = document.querySelector('#sound-toggle');
      button.textContent = isMuted() ? '♪ OFF' : '♪ ON';
      button.setAttribute('aria-pressed', String(!isMuted()));
      button.setAttribute('aria-label', t('game.soundToggle'));
    }

    // --- Pixel portraits for the dialog box ---
    function drawPortrait(palette) {
      const canvas = document.querySelector('#portrait');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      buildFrame('stand').slice(0, 14).forEach((row, y) => {
        [...row].forEach((ch, x) => {
          if (ch === '.' || !palette[ch]) return;
          ctx.fillStyle = palette[ch];
          ctx.fillRect(x, y, 1, 1);
        });
      });
    }

    // --- Typewriter ---
    let skipTyping = null;
    function typeInto(el, text) {
      el.textContent = '';
      const caret = document.createElement('span');
      caret.className = 'caret';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = text;
        return Promise.resolve();
      }
      return new Promise(resolve => {
        let i = 0;
        const node = document.createTextNode('');
        el.append(node, caret);
        const finish = () => {
          clearInterval(id);
          node.textContent = text;
          caret.remove();
          skipTyping = null;
          resolve();
        };
        skipTyping = finish;
        const id = setInterval(() => {
          i += 1;
          node.textContent = text.slice(0, i);
          if (i % 3 === 0 && text[i] !== ' ') sfx.type();
          if (i >= text.length) finish();
        }, 18);
      });
    }

    function showPlaceBanner(label) {
      const host = document.querySelector('#place-banner-host');
      host.innerHTML = '';
      const banner = document.createElement('div');
      banner.className = 'place-banner';
      banner.textContent = label;
      host.appendChild(banner);
    }

    function resetDay() {
      rng = createRng(isDaily ? dailySeed(eraId, new Date()) : randomSeed());
      resourceState = createResourceState(era);
      previousResourceState = null;
      dayState = createDayState(era, selectMemorySeed(getCurrentUser(), getEraMemories(eraId)));
      dailyObjectives = pickDailyObjectives(era, 3, rng);
      narrativeLog = [];
      gainsThisDay = {};
      summaryData = null;
    }

    function renderClock() {
      const slot = getCurrentSlot(era, dayState.elapsed);
      document.querySelector('#clock-time').textContent = formatClock(era, dayState.elapsed);
      slotLabel.textContent = `${localize(slot.label)} · ${t('game.until')} ${era.day.endLabel}`;
      const pct = Math.round(dayFraction(dayState) * 100);
      document.querySelector('#day-fill').style.width = `${pct}%`;
      document.querySelector('#day-sun').style.left = `${pct}%`;
    }

    function renderHUD() {
      renderClock();
      let anyCritical = false;
      const resourcesHtml = Object.entries(era.resources).map(([key, config]) => {
        const value = resourceState[key];
        const changed = previousResourceState !== null && previousResourceState[key] !== value;
        if (!isBarResource(config)) {
          return `<div class="res plain${changed ? ' tick' : ''}">
            <div class="res-top"><span class="res-name">${localize(config.label)}</span><span class="res-value">${value}</span></div>
          </div>`;
        }
        const fraction = resourceFraction(value, config);
        const level = resourceBarLevel(fraction);
        if (config.critical && level === 'critical') anyCritical = true;
        return `<div class="res ${level}${changed ? ' tick' : ''}">
          <div class="res-top"><span class="res-name">${localize(config.label)}</span><span class="res-value">${value}</span></div>
          <div class="res-track"><div class="res-fill" style="width:${Math.round(fraction * 100)}%"></div></div>
        </div>`;
      }).join('');

      // Which trait today's choices are adding up to, live: that decides the ending.
      const leading = rankTraits(dayState.traits)[0];
      const leaningHtml = `<div class="leaning">
        <span class="res-name">${t('game.leaning')}</span>
        <span class="leaning-value">${leading ? t(`trait.${leading.trait}`) : t('game.leaningNone')}</span>
      </div>`;

      hud.innerHTML = resourcesHtml + leaningHtml;
      document.body.classList.toggle('critical-alert', anyCritical);
      stage.setCritical(anyCritical);
      previousResourceState = { ...resourceState };
    }

    function formatCost(option) {
      const parts = [`<b>${option.cost?.time || 0}h</b>`];
      Object.entries(option.cost?.resources || {}).forEach(([key, delta]) => {
        if (!delta) return;
        parts.push(`<span class="${delta > 0 ? 'pos' : 'neg'}">${localize(era.resources[key].label)} ${delta > 0 ? '+' : ''}${delta}</span>`);
      });
      return `<span class="cost">${parts.join(' · ')}</span>`;
    }

    function oddsHtml(option) {
      if (!option.successChance) return '';
      const chance = computeSuccessChance(option.successChance, { resourceState, era, traits: dayState.traits });
      if (chance >= 1) return '';
      const pct = Math.round(chance * 100);
      return `<span class="odds"><span class="odds-bar"><span style="width:${pct}%"></span></span>${pct}%</span>`;
    }

    function pickNextCard() {
      const valid = getValidCards(cards, era, resourceState, dayState);
      currentCard = valid.length ? pickWeightedCard(valid, rng) : FILLER_CARD;
    }

    function hideAll() {
      decisionScreen.hidden = true;
      outcomeScreen.hidden = true;
      summaryScreen.hidden = true;
    }

    function renderDecisionHead() {
      const npc = currentCard.npcId ? findNpc(era, currentCard.npcId) : null;
      const place = placeForCard(eraId, currentCard);
      document.querySelector('#speaker').innerHTML = npc
        ? `${localize(npc.name)}<span class="speaker-role">${localize(npc.role)}</span>`
        : `${localize(place.label)}`;
      document.querySelector('#card-meta').textContent = `${Math.round(dayFraction(dayState) * 100)}% ${t('game.dayElapsed')}`;
      drawPortrait(npc ? npcPalette(npc.portraitColor, eraId) : playerPalette(eraId));
    }

    function renderOptions() {
      optionsEl.innerHTML = '';
      currentCard.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.innerHTML = `
          <span class="kbd choice-key">${index + 1}</span>
          <span class="choice-text">${localize(option.text)}</span>
          <span class="choice-foot">${formatCost(option)}${oddsHtml(option)}</span>
        `;
        button.addEventListener('click', () => chooseOption(option));
        button.addEventListener('mouseenter', () => sfx.move());
        optionsEl.appendChild(button);
      });
    }

    // Re-render the decision without replaying the walk or the typing
    // (used when the language changes mid-card).
    function renderDecisionUI() {
      hideAll();
      decisionScreen.hidden = false;
      renderHUD();
      renderDecisionHead();
      cardText.textContent = localize(currentCard.text);
      renderOptions();
      optionsEl.classList.remove('revealing');
    }

    async function showDecision() {
      phase = 'walking';
      busy = true;
      pickNextCard();
      hideAll();
      renderHUD();
      const place = placeForCard(eraId, currentCard);
      const npc = currentCard.npcId ? findNpc(era, currentCard.npcId) : null;
      showPlaceBanner(npc ? `${localize(place.label)} · ${localize(npc.name)}` : localize(place.label));
      await withTimeout(stage.goTo(place, npc ? { color: npc.portraitColor } : null), 6000);

      phase = 'decision';
      decisionScreen.hidden = false;
      renderDecisionHead();
      renderOptions();
      optionsEl.classList.add('revealing');
      await typeInto(cardText, localize(currentCard.text));
      optionsEl.classList.remove('revealing');
      busy = false;
      optionsEl.querySelector('.choice')?.focus({ preventScroll: true });
    }

    async function chooseOption(option) {
      if (busy || phase !== 'decision') return;
      busy = true;
      sfx.select();
      optionsEl.querySelectorAll('.choice').forEach(button => { button.disabled = true; });

      const { success, chance, outcome } = resolveOption(option, { resourceState, era, traits: dayState.traits }, rng);
      const combined = mergeDeltas(option.cost?.resources, outcome.resources);
      resourceState = applyResourceDeltas(resourceState, era, combined);
      dayState = advanceTime(dayState, option.cost?.time || 0);
      dayState = trackMinSeen(dayState, resourceState);
      // Traits accumulate exactly like NPC counters do -- same named-number
      // bag, same helper; only what they mean at day's end differs.
      dayState = { ...dayState, traits: applyCounterDeltas(dayState.traits, option.traits) };
      if (outcome.flagsSet?.length) dayState = { ...dayState, flags: [...dayState.flags, ...outcome.flagsSet] };
      if (outcome.countersAdd) dayState = { ...dayState, counters: applyCounterDeltas(dayState.counters, outcome.countersAdd) };
      dayState = { ...dayState, playedCardIds: [...dayState.playedCardIds, currentCard.id] };
      gainsThisDay = mergeDeltas(gainsThisDay, combined);
      if (outcome.text) narrativeLog.push(outcome.text);

      // A sure thing is not a gamble: it gets no SUCCESS/FAILURE tag and no big reaction.
      currentOutcome = { hasChance: !!option.successChance && chance < 1, success, text: outcome.text, combined };

      // The stage acts it out before the words arrive.
      phase = 'acting';
      decisionScreen.hidden = true;
      await withTimeout(stage.act(actionForOption(option)), 4000);
      stage.setDayFraction(dayFraction(dayState));
      const reaction = reactionForOutcome(currentOutcome);
      if (reaction === 'cheer') sfx.good(); else if (reaction === 'stumble') sfx.bad(); else sfx.neutral();
      await withTimeout(stage.react(reaction, deltaPopups(combined, era.resources, localize)), 4000);

      phase = 'outcome';
      renderHUD();
      renderOutcomeUI();
      busy = false;
      document.querySelector('#outcome-continue').focus({ preventScroll: true });
    }

    function renderOutcomeUI() {
      hideAll();
      outcomeScreen.hidden = false;
      const tag = document.querySelector('#outcome-tag');
      tag.textContent = currentOutcome.hasChance ? (currentOutcome.success ? t('outcome.success') : t('outcome.failure')) : '';
      tag.className = `outcome-tag ${currentOutcome.hasChance ? (currentOutcome.success ? 'ok' : 'bad') : ''}`;
      document.querySelector('#outcome-text').textContent = currentOutcome.text ? localize(currentOutcome.text) : '';
      document.querySelector('#outcome-deltas').innerHTML = Object.entries(currentOutcome.combined)
        .filter(([, value]) => value !== 0)
        .map(([key, value]) => `<span class="delta ${value > 0 ? 'up' : 'down'}">${localize(era.resources[key].label)} ${value > 0 ? '+' : ''}${value}</span>`)
        .join('');
    }

    function continueDay() {
      if (busy || phase !== 'outcome') return;
      sfx.move();
      if (isTimeUp(dayState) || isCriticalDepleted(resourceState, era)) endDay();
      else showDecision();
    }

    document.querySelector('#outcome-continue').addEventListener('click', continueDay);

    function endDay() {
      const objectivesResults = dailyObjectives.map(objective => ({
        objective,
        complete: isObjectiveComplete(objective, { resourceState, dayState }),
      }));
      const completedCount = objectivesResults.filter(entry => entry.complete).length;
      recordDayResult(eraId, { objectivesCompleted: completedCount });
      recordDayGains(eraId, gainsThisDay);
      if (getCurrentUser()) recordEraMemories(eraId, extractMemorableState(era, dayState));
      if (isDaily && getCurrentUser()) recordStreakForToday(dailyDateKeyValue);
      const newlyUnlocked = checkAndUnlockMetaAchievements(eraId, era);
      const criticalKey = getCriticalResourceKey(resourceState, era);
      const persona = resolvePersona(era, dayState.traits);

      let score = null;
      if (isDaily) {
        score = computeDayScore({ objectivesCompletedCount: completedCount, resourceState, era });
        saveLocalDailyResult(eraId, {
          date: dailyDateKeyValue,
          eraId,
          objectivesResults: objectivesResults.map(entry => ({ id: entry.objective.id, complete: entry.complete })),
          finalResources: { ...resourceState },
          criticalKey: criticalKey || null,
          personaId: persona?.id || null,
          log: [...narrativeLog],
          score: score.total,
          objectivesScore: score.objectivesScore,
          tiebreakScore: score.tiebreakScore,
        });
      }

      summaryData = { objectivesResults, newlyUnlocked, criticalKey, persona, finalResources: { ...resourceState }, log: [...narrativeLog], score, streak: getStreak(), alreadyPlayed: false };
      phase = 'summary';
      stage.finale(!criticalKey);
      sfx.end(!criticalKey);
      renderSummaryUI();

      if (isDaily) {
        (async () => {
          if (getCurrentUser()) {
            await submitDailyScore(eraId, dailyDateKeyValue, {
              score: score.total,
              objectivesScore: score.objectivesScore,
              tiebreakScore: score.tiebreakScore,
              objectivesResults: objectivesResults.map(entry => ({ id: entry.objective.id, complete: entry.complete })),
              finalResources: { ...resourceState },
              criticalKey: criticalKey || null,
            });
          }
          await refreshLeaderboard();
        })();
      }
    }

    function showAlreadyPlayed(saved) {
      const objectivesResults = (saved.objectivesResults || []).map(entry => {
        const objective = (era.objectivesPool || []).find(o => o.id === entry.id) || { description: { en: entry.id, es: entry.id } };
        return { objective, complete: entry.complete };
      });
      summaryData = {
        objectivesResults,
        newlyUnlocked: [],
        criticalKey: saved.criticalKey || null,
        persona: (era.personas || []).find(p => p.id === saved.personaId) || null,
        finalResources: saved.finalResources || {},
        log: saved.log || null,
        score: { objectivesScore: saved.objectivesScore, tiebreakScore: saved.tiebreakScore, total: saved.score },
        streak: getStreak(),
        alreadyPlayed: true,
      };
      phase = 'summary';
      stage.finale(!saved.criticalKey);
      renderSummaryUI();
      refreshLeaderboard();
    }

    function renderSummaryUI() {
      hideAll();
      summaryScreen.hidden = false;
      document.body.classList.remove('critical-alert');
      stage.setCritical(false);

      const persona = summaryData.persona;
      document.querySelector('#verdict-kicker').textContent = summaryData.alreadyPlayed ? t('daily.alreadyPlayedHeading') : t('game.summaryKicker');
      document.querySelector('#persona-name').textContent = persona ? localize(persona.name) : t('game.summaryHeading');
      document.querySelector('#persona-desc').textContent = persona ? localize(persona.description) : '';

      const endingEl = document.querySelector('#ending-line');
      endingEl.textContent = summaryData.criticalKey ? localize(era.badEnding) : localize(era.goodEnding);
      endingEl.className = `ending-line ${summaryData.criticalKey ? 'bad' : ''}`;

      document.querySelector('#summary-objectives').innerHTML = summaryData.objectivesResults.map((entry, index) => `
        <li class="${entry.complete ? 'done' : ''}" style="animation-delay:${index * 0.08}s"><span class="mark">${entry.complete ? '✓' : '✗'}</span> ${localize(entry.objective.description)}</li>
      `).join('');

      document.querySelector('#summary-resources').innerHTML = Object.entries(era.resources).map(([key, config], index) => `
        <li style="animation-delay:${index * 0.05}s">${localize(config.label)}<span class="val">${summaryData.finalResources[key] ?? '–'}</span></li>
      `).join('');

      document.querySelector('#summary-achievements').innerHTML = (summaryData.newlyUnlocked || []).map((achievement, index) => `
        <div class="unlock" style="animation-delay:${0.3 + index * 0.12}s"><strong>${localize(achievement.title)}</strong><br><span class="muted small">${localize(achievement.description)}</span></div>
      `).join('');

      document.querySelector('#summary-log').innerHTML = summaryData.log
        ? (summaryData.log.map(line => `<p>${localize(line)}</p>`).join('') || `<p>${t('game.recapEmpty')}</p>`)
        : `<p>${t('daily.recapUnavailable')}</p>`;

      const scoreSection = document.querySelector('#summary-score');
      if (summaryData.score) {
        scoreSection.hidden = false;
        scoreSection.innerHTML = `
          <div class="score"><div class="score-value">${summaryData.score.objectivesScore}</div><div class="score-label">${t('daily.scoreObjectives')}</div></div>
          <div class="score"><div class="score-value">${summaryData.score.tiebreakScore}</div><div class="score-label">${t('daily.scoreTiebreak')}</div></div>
          <div class="score total"><div class="score-value">${summaryData.score.total}</div><div class="score-label">${t('daily.scoreTotal')}</div></div>
        `;
      } else {
        scoreSection.hidden = true;
        scoreSection.innerHTML = '';
      }

      const streakEl = document.querySelector('#summary-streak');
      const hasStreak = isDaily && summaryData.streak && summaryData.streak.currentStreak > 1;
      streakEl.hidden = !hasStreak;
      if (hasStreak) streakEl.textContent = t('daily.streakLabel', { count: summaryData.streak.currentStreak });

      document.querySelector('#play-again').hidden = isDaily;
      document.querySelector('#summary-comeback').hidden = !isDaily;
      document.querySelector('#summary-leaderboard-section').hidden = !isDaily;
      document.querySelector('#download-card').hidden = !isDaily || !summaryData.score;
    }

    function renderLeaderboardHtml() {
      const list = document.querySelector('#summary-leaderboard');
      if (lastLeaderboardEntries === null) {
        list.innerHTML = `<li>${t('daily.leaderboardLoading')}</li>`;
        return;
      }
      const currentUsername = getCurrentUser()?.displayName;
      let html = lastLeaderboardEntries.length === 0
        ? `<li>${t('daily.leaderboardEmpty')}</li>`
        : lastLeaderboardEntries.map((entry, index) => `
            <li class="${entry.username === currentUsername ? 'you' : ''}">
              <span class="rank">${String(index + 1).padStart(2, '0')}</span>${entry.username}<span class="val">${entry.score}</span>
            </li>
          `).join('');
      if (!getCurrentUser()) html += `<li class="muted small">${t('daily.leaderboardLoginToAppear')}</li>`;
      list.innerHTML = html;
    }

    async function refreshLeaderboard() {
      lastLeaderboardEntries = null;
      renderLeaderboardHtml();
      try {
        lastLeaderboardEntries = await getDailyLeaderboard(eraId, dailyDateKeyValue, 10);
      } catch (error) {
        console.warn('OneDay: could not load daily leaderboard', error);
        lastLeaderboardEntries = [];
      }
      renderLeaderboardHtml();
    }

    document.querySelector('#play-again').addEventListener('click', () => {
      resetDay();
      stage.reset();
      showDecision();
    });

    document.querySelector('#download-card').addEventListener('click', async () => {
      const canvas = document.querySelector('#share-canvas');
      await renderShareCardCanvas(canvas, {
        eraName: localize(era.name),
        accentHue: eraMeta.accent,
        personaName: summaryData.persona ? localize(summaryData.persona.name) : '',
        endingText: summaryData.criticalKey ? localize(era.badEnding) : localize(era.goodEnding),
        dateLabel: dailyDateKeyValue,
        score: summaryData.score,
        objectives: summaryData.objectivesResults.map(entry => ({ description: localize(entry.objective.description), complete: entry.complete })),
        streak: summaryData.streak,
        appLabel: 'OneDay',
      });
      downloadCanvasAsPng(canvas, `oneday-${eraId}-${dailyDateKeyValue}.png`);
    });

    // Keyboard: 1-4 (or A-D) choose, Enter/Space continues or skips the typing.
    document.addEventListener('keydown', event => {
      if (event.target.closest('input, textarea')) return;
      if (phase === 'decision') {
        if (skipTyping && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); skipTyping(); return; }
        const index = '1234'.indexOf(event.key) >= 0 ? '1234'.indexOf(event.key) : 'abcd'.indexOf(event.key.toLowerCase());
        if (index >= 0 && currentCard.options[index] && !skipTyping) { event.preventDefault(); chooseOption(currentCard.options[index]); }
      } else if (phase === 'outcome' && (event.key === 'Enter' || event.key === ' ') && event.target.id !== 'outcome-continue') {
        event.preventDefault();
        continueDay();
      }
    });
    cardText.addEventListener('click', () => skipTyping?.());

    document.querySelector('#sound-toggle').addEventListener('click', () => {
      setMuted(!isMuted());
      renderSoundToggle();
      sfx.select();
    });

    document.querySelector('#lang-en').addEventListener('click', () => setLanguage('en'));
    document.querySelector('#lang-es').addEventListener('click', () => setLanguage('es'));
    onLanguageChange(() => {
      applyStaticI18n();
      if (phase === 'decision') { skipTyping?.(); renderDecisionUI(); }
      else if (phase === 'outcome') { renderHUD(); renderOutcomeUI(); }
      else if (phase === 'summary') { renderSummaryUI(); if (isDaily) renderLeaderboardHtml(); }
      else if (dayState) renderHUD();
    });

    (async function init() {
      await loadStrings();
      const loaded = await loadEra(eraId);
      era = loaded.era;
      cards = loaded.cards;
      isDaily = params.get('daily') === '1';
      dailyDateKeyValue = todayDateKey();
      applyStaticI18n();

      try {
        const { createStage } = await import('./shared/stage/stage.js');
        stage = await createStage(document.querySelector('#stage'), { eraId, mode: 'play' });
      } catch (error) {
        console.warn('OneDay: 3D stage unavailable, playing without it', error);
        document.body.classList.add('no-stage');
      }

      if (isDaily) {
        const local = getLocalDailyResult(eraId);
        if (hasPlayedToday(local, dailyDateKeyValue)) { showAlreadyPlayed(local); return; }
        if (getCurrentUser()) {
          try {
            const remote = await checkRemoteDailyEntry(eraId, dailyDateKeyValue);
            if (remote) { showAlreadyPlayed(remote); return; }
          } catch (error) { console.warn('OneDay: could not check remote daily entry', error); }
        }
      }

      resetDay();
      showDecision();
    })();
  </script>
</body>
</html>
